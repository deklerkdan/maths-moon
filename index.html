<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080B">
<meta name="description" content="A maths game: adding, taking away, times tables and dividing. Fill the moon.">
<title>Luna's Maths Moon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maths Moon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Lexend:wght@400;700&display=swap">
<style>
/* Same night sky as Word Moon: plain black, one sum at a time. No pink anywhere.
   Each skill fills a moon: new -> crescent (4 right) -> half (8) -> full (12). */
:root{
  --bg:#07080B; --panel:#12151B; --panel2:#1A1E26; --line:#2C323D; --line2:#454D5B;
  --ink:#F5F1E6; --muted:#9BA5B1;
  --moon:#F4D26B; --moon-soft:#352E1B;
  --good:#3FC872; --good-soft:#123020; --no:#E5383B; --no-soft:#3A1415;
  --try:#FF9F1C; --try-soft:#3A2610;
  --c1:#FF9F1C; --c2:#9D7BFF; --blue:#2F9BFF;
  --font-display:'Sniglet','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{max-width:780px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
h1,h2,h3{font-family:var(--font-display);font-weight:800;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--moon);outline-offset:3px}

.top{display:flex;align-items:center;gap:10px;min-height:48px}
.spacer{flex:1}
.iconbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line);font-size:22px;flex:none}
.grown{position:relative;overflow:hidden;font-size:13px;color:var(--muted);padding:8px 12px;border-radius:999px;border:1px solid var(--line);flex:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.grown .fill{position:absolute;inset:0;width:0;background:var(--moon-soft);z-index:0}
.grown span{position:relative}
.exitbtn{flex:none;font-size:15px;font-weight:700;padding:10px 14px;border-radius:999px;border:2px solid var(--line2);color:var(--ink);background:var(--panel2)}
.rprog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.rprog span{flex:none;font-weight:700;color:var(--ink)}
.rbar{flex:1;height:8px;border-radius:99px;background:var(--panel2);overflow:hidden} .rbar i{display:block;height:100%;width:0;background:var(--moon);transition:width .3s}
.snd{margin:0;background:var(--try-soft);border:1px solid var(--try);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:15px}
main{flex:1;display:flex;flex-direction:column;gap:20px}

.mn{width:1em;height:1em;vertical-align:-0.14em;flex:none}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:3vh}
.moonwolf{position:relative;width:min(220px,56vw);aspect-ratio:1;max-width:100%}
.moonwolf .disc{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle at 38% 34%,#FFF4C8 0%,var(--moon) 55%,#D9B24B 100%);box-shadow:0 0 60px 10px rgba(244,210,107,.18)}
.moonwolf svg{position:absolute;left:18%;bottom:-2%;width:64%;height:auto}
.hero h1{font-size:clamp(32px,7vw,50px)}
.hero .sub{color:var(--muted);font-size:17px;max-width:34ch}
.vnote{color:var(--muted);font-size:14px;max-width:40ch}
.big{font-family:var(--font-display);font-size:28px;font-weight:800;padding:16px 40px;border-radius:999px;background:var(--moon);color:#1B1606;box-shadow:0 0 0 6px var(--moon-soft)}
.big[disabled]{opacity:.5;cursor:default}
.soft{font-family:var(--font-display);font-size:20px;padding:12px 24px;border-radius:999px;border:2px solid var(--line2);color:var(--ink)}
.small{font-size:15px;color:var(--muted);padding:8px 16px;border-radius:999px;border:1px solid var(--line2)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.center{justify-content:center}
.nowgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:520px}
.nowcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;text-align:left;min-width:0}
.nowcard .mn{font-size:34px}
.nowcard b{display:block;font-size:13px;color:var(--muted);font-weight:400}
.nowcard span{font-size:16px;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:16px;display:inline-flex;gap:6px;align-items:center}

/* one sum */
.stage{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.qhead{display:flex;align-items:center;gap:10px;width:100%;flex-wrap:wrap}
.skilltag{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);flex:1;min-width:0;text-align:left}
.skilltag .mn{font-size:26px}
.pips{display:flex;gap:3px} .pips i{width:10px;height:10px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2)} .pips i.on{background:var(--moon);border-color:var(--moon)}
.knowall{font-family:var(--font-display);font-weight:800;font-size:17px;padding:10px 16px;border-radius:999px;background:var(--blue);color:#04121F;box-shadow:0 0 0 4px rgba(47,155,255,.25);flex:none}
.again-tag{font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 12px;border-radius:999px;border:2px solid var(--c2);color:var(--c2)}
.sum{font-family:var(--font-display);font-weight:800;font-size:clamp(44px,13vw,100px);line-height:1.1;padding:10px 26px;border-radius:24px;background:var(--panel);border:2px solid var(--line);max-width:100%;white-space:nowrap;overflow:hidden}
.sum .q{color:var(--moon)}
.sum.right{border-color:var(--good)} .sum.wrong{border-color:var(--no)}
.ansbox{min-width:160px;min-height:76px;padding:6px 22px;border-radius:18px;background:var(--panel);border:2px solid var(--line);border-bottom:4px solid var(--moon);font-family:var(--font-display);font-weight:800;font-size:52px;line-height:1.2;display:flex;align-items:center;justify-content:center;letter-spacing:.04em}
.ansbox.right{border-color:var(--good)} .ansbox.wrong{border-color:var(--no)}
.ansbox .ph{color:var(--line2)}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:520px}
.choice{min-height:96px;border-radius:22px;background:var(--panel2);border:3px solid var(--line2);font-family:var(--font-display);font-weight:800;font-size:clamp(36px,10vw,52px)}
.choice:active{transform:scale(.96)}
.choice.right{border-color:var(--good);background:var(--good-soft)} .choice.wrong{border-color:var(--no);background:var(--no-soft)} .choice.fade{opacity:.35}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:340px}
.key{height:62px;border-radius:14px;background:#F5F1E6;color:#16181D;font-weight:700;font-size:30px;box-shadow:0 4px 0 #9BA5B1;touch-action:manipulation}
.key:active{transform:translateY(2px);box-shadow:0 2px 0 #9BA5B1}
.key.alt{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 #000;border:1px solid var(--line2);font-size:24px}
.key.go{background:var(--good);color:#04140A;box-shadow:0 4px 0 #1E7A44}
.key[disabled]{opacity:.4}
.skipbtn{font-size:16px;color:var(--muted);padding:8px 18px;border-radius:999px;border:1px solid var(--line2)}
.fb{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;width:100%}
.fb .say{font-family:var(--font-display);font-size:30px}
.fb .say.good{color:var(--good)} .fb .say.try{color:var(--try)}
.fb .move{font-size:18px} .fb .move b{color:var(--moon)}
.help{background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:520px;width:100%}
.help p{font-size:20px}
.help .eq{font-family:var(--font-display);font-size:30px;color:var(--moon)}
.dots{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.drow{display:flex;gap:inherit}
.d{width:var(--ds,16px);height:var(--ds,16px);border-radius:50%;background:var(--c1);flex:none}
.d.b{background:var(--c2)} .d.x{background:transparent;border:2px dashed var(--line2)}
.gap{width:10px}
.dgroups{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.dgroups>span{font-family:var(--font-display);font-size:30px;color:var(--muted)}
.count{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.count span{font-size:16px;padding:2px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.count span.end{border-color:var(--moon);color:var(--moon);font-weight:700}

/* My moons */
.strand{display:flex;flex-direction:column;gap:10px}
.strand h3{font-size:22px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));gap:10px}
.scard{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:12px 8px;border-radius:16px;background:var(--panel);border:1px solid var(--line);min-width:0}
.scard .mn{font-size:40px}
.scard b{font-size:15px;line-height:1.25}
.scard small{color:var(--muted);font-size:13px}
.scard.next{border:2px solid var(--c2)}
.scard.full{border-color:var(--moon)}
.wpop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px}
.popcard{background:var(--panel);border:2px solid var(--line2);border-radius:24px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px;width:min(460px,100%);text-align:center}
.popcard .mn{font-size:64px}
.popcard .big{font-size:24px;padding:14px 30px}
.popcard .ex{font-family:var(--font-display);font-size:34px;color:var(--moon)}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));translate:-50% -140%;z-index:50;background:var(--panel2);border:2px solid var(--moon);color:var(--ink);border-radius:999px;padding:10px 18px;font-family:var(--font-display);font-size:18px;transition:translate .3s ease;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{translate:-50% 0}

/* names */
.plist{display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
.pbtn{font-family:var(--font-display);font-size:24px;padding:14px 20px;border-radius:18px;background:var(--panel2);border:2px solid var(--line2);text-align:left}
.pbtn:hover{border-color:var(--moon)}
.padd{display:flex;gap:10px;width:min(420px,100%);flex-wrap:wrap;justify-content:center}
.padd input{flex:1;min-width:0;font:inherit;font-size:20px;padding:12px 16px;border-radius:999px;border:2px solid var(--line2);background:var(--panel);color:var(--ink)}
.padd .big{font-size:22px;padding:12px 24px}

/* grown-ups */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:22px}
.panel p{color:var(--muted);font-size:16px}
.vtips{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2)}
.vtips summary{cursor:pointer;font-weight:700;color:var(--moon)}
.vtips p{margin-top:8px}
.pill{padding:8px 14px;border-radius:999px;border:2px solid var(--line);font-size:15px}
.pill[aria-pressed="true"]{border-color:var(--moon);background:var(--moon-soft)}
.danger{border-color:var(--no);color:var(--no)}
.slist{display:flex;flex-direction:column;gap:6px;font-size:15px}
.slist div{display:flex;gap:8px;align-items:center}
.slist span{color:var(--muted)}
textarea{width:100%;min-height:72px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;font:14px/1.4 ui-monospace,Consolas,monospace}
input[type=range]{width:min(320px,100%);accent-color:var(--moon)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.key{height:56px}.choice{min-height:84px}.sum{padding:8px 16px}.qhead .knowall{font-size:15px;padding:8px 12px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="wolf" viewBox="0 0 120 104">
    <path d="M20 46 L28 4 L54 30 Z M100 46 L92 4 L66 30 Z" fill="#6F7D8A" stroke="#22323B" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M27 36 L31 14 L45 29 Z M93 36 L89 14 L75 29 Z" fill="#C9B79C"/>
    <path d="M60 18 C30 18 14 38 14 58 C14 70 22 78 30 82 L22 92 L42 88 C48 94 54 96 60 96 C66 96 72 94 78 88 L98 92 L90 82 C98 78 106 70 106 58 C106 38 90 18 60 18 Z" fill="#8E9BA8" stroke="#22323B" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M60 30 C54 40 52 52 50 62 L70 62 C68 52 66 40 60 30 Z" fill="#E9EDF1"/>
    <ellipse cx="60" cy="74" rx="21" ry="16" fill="#E9EDF1"/>
    <circle cx="44" cy="54" r="6.5" fill="#E8A33B" stroke="#22323B" stroke-width="2"/><circle cx="44" cy="54" r="3.2" fill="#22323B"/><circle cx="45.5" cy="52.5" r="1.2" fill="#fff"/>
    <circle cx="76" cy="54" r="6.5" fill="#E8A33B" stroke="#22323B" stroke-width="2"/><circle cx="76" cy="54" r="3.2" fill="#22323B"/><circle cx="77.5" cy="52.5" r="1.2" fill="#fff"/>
    <ellipse cx="60" cy="67" rx="7.5" ry="5" fill="#22323B"/>
    <path d="M60 72 L60 76 M60 76 Q54 83 48 79 M60 76 Q66 83 72 79" stroke="#22323B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="app">
  <header class="top">
    <button class="exitbtn" id="exitBtn" type="button" hidden>✕ Stop</button>
    <div class="spacer"></div>
    <button class="iconbtn" id="stopBtn" type="button" aria-label="Stop talking" hidden>■</button>
    <button class="iconbtn" id="hearBtn" type="button" aria-label="Hear it again" hidden>🔊</button>
    <button class="iconbtn" id="moonsBtn" type="button" aria-label="My moons">🌙</button>
    <button class="grown" id="grownBtn" type="button" aria-label="Grown-ups page. Press and hold to open."><i class="fill" id="grownFill"></i><span>Grown-ups (hold)</span></button>
  </header>
  <div class="rprog" id="rprog" hidden><span id="rtext"></span><div class="rbar"><i id="rbar"></i></div></div>
  <p class="snd" id="snd" role="status" hidden></p>
  <main id="stage" aria-live="polite"></main>
</div>

<script>
(function(){
'use strict';
/* =================== Skills ===================
   Four kinds of sums, each a ladder of skills from easiest to hardest.
   A round mixes the next skill of each kind (the first one that isn't a full moon yet). */
const STRANDS=[
  {id:'add',  name:'Adding',       emoji:'➕'},
  {id:'sub',  name:'Taking away',  emoji:'➖'},
  {id:'times',name:'Times tables', emoji:'✖️'},
  {id:'div',  name:'Dividing',     emoji:'➗'}
];
const SKILLS=[
  {id:'add10',   strand:'add', name:'Adding to 10',          ex:'4 + 5'},
  {id:'add20',   strand:'add', name:'Adding to 20',          ex:'8 + 7'},
  {id:'addtens', strand:'add', name:'Adding tens',           ex:'30 + 40'},
  {id:'add2d1d', strand:'add', name:'Adding to 100',         ex:'34 + 5'},
  {id:'add2d2d', strand:'add', name:'Two big numbers',       ex:'23 + 45'},
  {id:'sub10',   strand:'sub', name:'Taking away in 10',     ex:'9 − 4'},
  {id:'sub20',   strand:'sub', name:'Taking away in 20',     ex:'15 − 8'},
  {id:'subtens', strand:'sub', name:'Taking away tens',      ex:'70 − 30'},
  {id:'sub2d1d', strand:'sub', name:'Taking away in 100',    ex:'43 − 7'},
  {id:'sub2d2d', strand:'sub', name:'Two big numbers',       ex:'65 − 23'},
  {id:'t2',  strand:'times', name:'2 times table',  n:2,  ex:'2 × 6'},
  {id:'t5',  strand:'times', name:'5 times table',  n:5,  ex:'5 × 4'},
  {id:'t10', strand:'times', name:'10 times table', n:10, ex:'10 × 3'},
  {id:'t3',  strand:'times', name:'3 times table',  n:3,  ex:'3 × 7'},
  {id:'t4',  strand:'times', name:'4 times table',  n:4,  ex:'4 × 6'},
  {id:'t6',  strand:'times', name:'6 times table',  n:6,  ex:'6 × 8'},
  {id:'t7',  strand:'times', name:'7 times table',  n:7,  ex:'7 × 7'},
  {id:'t8',  strand:'times', name:'8 times table',  n:8,  ex:'8 × 4'},
  {id:'t9',  strand:'times', name:'9 times table',  n:9,  ex:'9 × 6'},
  {id:'d2510', strand:'div', name:'Dividing by 2, 5 and 10', by:[2,5,10], ex:'20 ÷ 5'},
  {id:'d34',   strand:'div', name:'Dividing by 3 and 4',     by:[3,4],    ex:'24 ÷ 3'},
  {id:'d67',   strand:'div', name:'Dividing by 6 and 7',     by:[6,7],    ex:'42 ÷ 7'},
  {id:'d89',   strand:'div', name:'Dividing by 8 and 9',     by:[8,9],    ex:'72 ÷ 9'}
];
const SK={}; SKILLS.forEach(s=>SK[s.id]=s);
const STEP=4, FULL=12;                 /* 4 right -> crescent, 8 -> half, 12 -> full */
const PHASE_NAME=['New','Crescent','Half moon','Full moon'];

const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const SYM={'+':'+','-':'−','x':'×','/':'÷'};
const WORD={'+':'plus','-':'take away','x':'times','/':'divided by'};

/* Make one sum for a skill: {a, op, b, ans} */
function makeSum(id){
  const s=SK[id]; let a,b,op;
  switch(id){
    case 'add10': op='+'; a=ri(1,9); b=ri(1,10-a); break;
    case 'add20': op='+';
      if(Math.random()<0.7){ do{ a=ri(3,9); b=ri(3,9); }while(a+b<=10); }
      else { a=ri(11,17); b=ri(1,20-a); }
      if(Math.random()<0.5) [a,b]=[b,a]; break;
    case 'addtens': op='+'; a=10*ri(1,8); b=10*ri(1,(100-a)/10); break;
    case 'add2d1d': op='+'; do{ a=ri(12,88); }while(a%10===0); b=ri(2,9); if(a+b>99) b=99-a; if(b<2){ a=45; b=ri(2,9); } break;
    case 'add2d2d': op='+'; a=ri(11,78); b=ri(11,99-a); if(b<11){ a=ri(11,40); b=ri(11,50); } break;
    case 'sub10': op='-'; a=ri(3,10); b=ri(1,a-1); break;
    case 'sub20': op='-'; a=ri(11,19); b=ri(2,9); break;
    case 'subtens': op='-'; a=10*ri(2,10); b=10*ri(1,a/10-1); break;
    case 'sub2d1d': op='-'; a=ri(21,99); b=ri(2,9); break;
    case 'sub2d2d': op='-'; a=ri(31,99); b=ri(11,a-10); break;
    default:
      if(s.n){ op='x'; const k=ri(1,10); if(Math.random()<0.5){ a=s.n; b=k; } else { a=k; b=s.n; } }
      else if(s.by){ op='/'; b=pick(s.by); const q=ri(1,10); a=b*q; }
  }
  const ans = op==='+'?a+b : op==='-'?a-b : op==='x'?a*b : a/b;
  return {skill:id, a, op, b, ans};
}
const sumKey=q=>q.a+q.op+q.b;
const sumText=q=>q.a+' '+SYM[q.op]+' '+q.b;
const sumSpeech=q=>q.a+' '+WORD[q.op]+' '+q.b;

/* Two wrong answers that look likely, for the big buttons. */
function wrongOnes(q){
  const A=q.ans, c=[];
  if(q.op==='x'){ const n=SK[q.skill].n, k=q.a===n?q.b:q.a; c.push(n*(k+1), n*(k-1), A+1, A-1, (n+1)*k); }
  else if(q.op==='/'){ c.push(A+1, A-1, A+2, A-2); }
  else { c.push(A+1, A-1, A+2, A-2); if(A>=20) c.push(A+10, A-10); }
  const ok=shuffle([...new Set(c)].filter(x=>x>=0 && x!==A && Number.isInteger(x)));
  while(ok.length<2) ok.push(A+ok.length+3);
  return ok.slice(0,2);
}

/* =================== Names and saving ===================
   Each name keeps its own progress on this device (localStorage). Backup codes move it to another device. */
const STORE='luna-maths-moon-v1', NAMES_KEY='luna-maths-moon-names', WHO_KEY='luna-maths-moon-who';
const lsGet=(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const slugName=n=>String(n).trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'player';
const blank=()=>({v:1, rate:0.95, sound:true, deviceVoice:'', perRound:12, kinds:{add:true,sub:true,times:true,div:true}, skills:{}, days:{}, turn:0, updatedAt:0});
const migrate=s=>(s && s.v===1) ? Object.assign(blank(), s, {kinds:Object.assign(blank().kinds, s.kinds||{})}) : null;
let players=lsGet(NAMES_KEY,[]);
let who=lsGet(WHO_KEY,null);
let state=blank();
function loadLocal(id){ state=migrate(lsGet(STORE+':'+id,null))||blank(); }
if(who && players.some(p=>p.id===who)) loadLocal(who); else who=null;
function save(){ state.updatedAt=Date.now(); if(who) lsSet(STORE+':'+who, state); }
const playerName=()=>{ const p=players.find(x=>x.id===who); return p?p.name:''; };

const rec=id=>state.skills[id]||(state.skills[id]={pts:0, right:0, wrong:0, trusted:0, last:0});
const ptsOf=id=>(state.skills[id]&&state.skills[id].pts)||0;
const phaseOf=id=>{ const p=ptsOf(id); return p>=FULL?3 : p>=2*STEP?2 : p>=STEP?1 : 0; };
/* the next skill of a kind: the first one that isn't a full moon yet */
const nextOf=strand=>SKILLS.find(s=>s.strand===strand && phaseOf(s.id)<3)||null;

const $=(s,el=document)=>el.querySelector(s);
const stage=$('#stage');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};

/* Moon phases drawn by hand so they look the same on every device (the moon emoji shows oddly on some phones). */
const MOON_LIT=['','M12 2A10 10 0 0 1 12 22A5 10 0 0 0 12 2Z','M12 2A10 10 0 0 1 12 22Z','M12 2A10 10 0 0 1 12 22A10 10 0 0 1 12 2Z'];
const moon=i=>'<svg class="mn" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#232832" stroke="#5A6372" stroke-width="1.2"/>'+(i?'<path d="'+MOON_LIT[i]+'" fill="#F4D26B"/>':'')+'</svg>';
function pipsHTML(id){ const p=ptsOf(id), ph=phaseOf(id); if(ph>=3) return '';
  const inStep=p-ph*STEP; return '<span class="pips" aria-label="'+inStep+' of '+STEP+' to the next moon">'+[0,1,2,3].map(i=>'<i class="'+(i<inStep?'on':'')+'"></i>').join('')+'</span>'; }

/* =================== Voice ===================
   The device's own voices (speechSynthesis). Grown-ups can pick the nicest one. */
const canBrowser='speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let bVoice=null, browserSpeaking=false, appReady=false, view='who';
function voiceScore(v){
  const n=v.name||'';
  if(/compact|espeak|novelty|zarvox|bad news|bells|bubbles|cellos|trinoids|albert|fred|jester|organ|superstar|wobble|boing|junior|ralph|kathy|bahh|whisper|good news|hysterical|deranged|pipe/i.test(n)) return -100;
  let s=0;
  if(/natural|neural|online/i.test(n)) s+=60;
  if(/premium/i.test(n)) s+=55;
  if(/enhanced/i.test(n)) s+=45;
  if(/google/i.test(n)) s+=30;
  if(/karen|catherine|lee|daniel|serena|kate|moira|samantha|ava|zoe|allison|susan/i.test(n)) s+=10;
  s+=/en[-_]NZ/i.test(v.lang)?12:/en[-_]AU/i.test(v.lang)?10:/en[-_]GB/i.test(v.lang)?8:/en[-_](IE|ZA)/i.test(v.lang)?5:4;
  return s;
}
function deviceVoices(){ try{ return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a)); }catch(e){ return []; } }
function chooseBrowserVoice(){
  if(!canBrowser) return;
  const all=deviceVoices();
  bVoice=(state.deviceVoice && all.find(v=>v.name===state.deviceVoice)) || all[0] || null;
  if(appReady && (view==='grown' || view==='start')) render();
}
if(canBrowser){ chooseBrowserVoice(); try{ speechSynthesis.addEventListener('voiceschanged',chooseBrowserVoice); }catch(e){} }
const shortVoice=v=>v.name.replace(/^Microsoft |^Google /,'').replace(/ - .*$/,'');
function voiceNote(){
  if(!canBrowser) return 'This browser can’t read aloud. Try Chrome, Edge or Safari.';
  return 'Luna is using this device’s voice'+(bVoice?' ('+shortVoice(bVoice)+')':'')+'.';
}
let soundTrouble='', heardOnce=false;
function showTrouble(){ const el=$('#snd'); if(!el) return;
  const tx = !soundTrouble ? '' : canBrowser ? 'No sound? Check the phone isn’t on silent and the volume is up. If Luna still says nothing, open Grown-ups and tap a voice to try it.' : 'No sound? This browser can’t read aloud. Try Chrome, Edge or Safari.';
  el.textContent=tx; el.hidden=!tx; }
function browserSay(lines){
  if(!canBrowser){ soundTrouble='none'; showTrouble(); return Promise.resolve(); }
  return new Promise(res=>{
    let started=false;
    try{
      if(!bVoice) chooseBrowserVoice();
      /* cancel() right before speak() makes iPhones drop the new words, so only cancel when something is playing. */
      if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
      try{ speechSynthesis.resume(); }catch(e){}
      lines.forEach((tx,i)=>{ const u=new SpeechSynthesisUtterance(tx); if(bVoice){u.voice=bVoice;u.lang=bVoice.lang;} else u.lang='en-US';
        u.rate=0.9*state.rate/0.95; u.pitch=1.05;
        if(i===0) u.onstart=()=>{ started=true; heardOnce=true; if(soundTrouble){ soundTrouble=''; showTrouble(); } browserSpeaking=true; updateStop(); };
        if(i===lines.length-1) u.onend=u.onerror=()=>{ browserSpeaking=false; updateStop(); res(); };
        speechSynthesis.speak(u); });
    }catch(e){ res(); }
    setTimeout(()=>{ if(!started && !heardOnce && state.sound){ soundTrouble='silent'; showTrouble(); } }, 3000);
    setTimeout(res, 15000);
  });
}
/* A reading is a list of words to say and {pause:ms}. A newer say() or hush() ends the rest. */
let lastLines=[], sayToken=0;
async function say(items, opts){
  opts=opts||{};
  items=[].concat(items).filter(Boolean);
  if(!opts.noRemember) lastLines=items;
  if(!state.sound || !items.length) return;
  const my=++sayToken; let buf=[];
  const flush=async()=>{ if(!buf.length) return; const l=buf; buf=[]; await browserSay(l); };
  for(const it of items){
    if(my!==sayToken) return;
    if(typeof it==='string'){ buf.push(it); continue; }
    await flush(); if(my!==sayToken) return;
    if(it.pause) await wait(it.pause);
  }
  if(my===sayToken) await flush();
}
function hush(){ sayToken++; try{ canBrowser && speechSynthesis.cancel(); }catch(e){} browserSpeaking=false; updateStop(); }
function updateStop(){ const b=$('#stopBtn'); if(b) b.hidden=!browserSpeaking; }

/* little sounds (no files needed) */
let actx=null;
function chime(kind){
  if(!state.sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const notes=kind==='good'?[660,880]:kind==='full'?[523,659,784,1047]:kind==='up'?[587,740,880]:[300,250];
    notes.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=f;
      const t=actx.currentTime+i*0.11; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.4); });
  }catch(e){}
}
document.addEventListener('pointerdown',()=>{ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} },{capture:true});

function toast(text, sound){
  let el=$('#toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
  if(text && text.html) el.innerHTML=text.html; else el.textContent=text;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  if(sound) chime(sound);
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2600);
}

/* =================== A round ===================
   One sum at a time. The kinds take turns. A missed sum comes back 3 sums later.
   "I know it all" banks the whole skill as a full moon and doesn't use up the round. */
let sess=null, cur=null, timers=[];
const later=(fn,ms)=>{ const t=setTimeout(fn,ms); timers.push(t); return t; };
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
const PRAISE=['That’s right!','Well done!','Yes!','You got it!','Great work!','Spot on!'];

function newRound(only){
  sess={limit:state.perRound, done:0, right:0, only:only||null, retry:[], recent:[], start:{}, kinds:[]};
  SKILLS.forEach(s=>sess.start[s.id]=phaseOf(s.id));
}
function kindsOn(){ const k=STRANDS.filter(s=>state.kinds[s.id]).map(s=>s.id); return k.length?k:STRANDS.map(s=>s.id); }
function chooseSkill(){
  if(sess.only) return sess.only;
  const ks=kindsOn();
  state.turn=(state.turn||0)%ks.length; const k=ks[state.turn]; state.turn=(state.turn+1)%ks.length;
  const n=nextOf(k);
  return n ? n.id : pick(SKILLS.filter(s=>s.strand===k)).id;   /* every skill of this kind is full: practise any of them */
}
function nextSum(){
  if(sess.retry.length && sess.retry[0].at<=sess.done) return Object.assign({}, sess.retry.shift().q, {again:true});
  const id=chooseSkill(); let q, n=0;
  do{ q=makeSum(id); n++; }while(sess.recent.includes(sumKey(q)) && n<12);
  return q;
}
function begin(only){
  hush(); clearTimers(); newRound(only);
  const first=only?['Let’s practise '+SK[only].name.toLowerCase()+'!',{pause:500}]:['Hi! Let’s fill some moons.',{pause:500}];
  ask(nextSum(), first);
}
function ask(q, prefix){
  clearTimers();
  sess.recent.push(sumKey(q)); if(sess.recent.length>8) sess.recent.shift();
  const p=ptsOf(q.skill);
  cur={q, mode: p<STEP?'buttons':'pad', typed:'', answered:false, options:null};
  if(cur.mode==='buttons') cur.options=shuffle([q.ans].concat(wrongOnes(q)));
  view='sum'; render();
  say((prefix||[]).concat([(q.again?'Try this one again. ':'')+'What is '+sumSpeech(q)+'?']));
}
function nextOne(){
  hush(); clearTimers();
  if(!sess) return;
  if(sess.done>=sess.limit) return finishRound();
  ask(nextSum());
}
function answer(val){
  if(!cur || cur.answered) return;
  const q=cur.q, ok=(+val===q.ans);
  cur.answered=true; cur.given=+val; cur.ok=ok;
  const r=rec(q.skill), before=phaseOf(q.skill);
  r.last=Date.now();
  if(ok){ r.right++; r.pts=Math.min(FULL, r.pts+1); sess.right++; }
  else { r.wrong++; const floor=Math.min(FULL, before*STEP); r.pts=Math.max(floor, r.pts-1);
    sess.retry.push({q:{skill:q.skill,a:q.a,op:q.op,b:q.b,ans:q.ans}, at:sess.done+3}); }
  const d=state.days[today()]||(state.days[today()]={n:0,right:0}); d.n++; if(ok) d.right++;
  sess.done++;
  const after=phaseOf(q.skill);
  cur.moved = after>before ? after : 0;
  save(); render();
  if(ok){
    chime('good');
    const line=pick(PRAISE);
    cur.praise=line;
    if(cur.moved){ later(()=>toast(moonToast(q.skill, after), after===3?'full':'up'), 350); }
    say([line, cur.moved===3?'Full moon! You know '+SK[q.skill].name.toLowerCase()+'!':''].filter(Boolean),{noRemember:true});
    later(nextOne, cur.moved?2600:1300);
  } else {
    chime('try');
    say(['Good try. '+sumSpeech(q)+' is '+q.ans+'.'],{noRemember:true});
  }
}
function moonToast(id, ph){ return {html: moon(ph)+' '+PHASE_NAME[ph]+': '+esc(SK[id].name)+'!'}; }
function knowAll(){
  if(!cur) return; const id=cur.q.skill, r=rec(id);
  r.pts=FULL; r.trusted=1; r.last=Date.now(); save();
  toast('⭐ '+SK[id].name+': full moon!','full');
  hush(); clearTimers();
  if(sess.only){ sess.only=null; }      /* that skill is done: carry on with the usual mix */
  later(()=>ask(nextSum()), 600);
}
function skipSum(){ if(!cur||cur.answered) return; sess.done++; sess.skipped=(sess.skipped||0)+1; nextOne(); }
function finishRound(){
  clearTimers(); hush(); view='end'; render();
  say(['Done for today! Great work!'],{noRemember:true});
}

/* =================== Screens =================== */
function topBar(){
  const inRound = !!sess && view==='sum';
  $('#exitBtn').hidden=!inRound; $('#rprog').hidden=!inRound; $('#hearBtn').hidden=view!=='sum';
  if(inRound){ $('#rtext').textContent='Sum '+Math.min(sess.done+(cur&&cur.answered?0:1), sess.limit)+' of '+sess.limit;
    $('#rbar').style.width=Math.round(100*sess.done/Math.max(1,sess.limit))+'%'; }
  $('#moonsBtn').hidden = view==='moons' || view==='grown' || view==='who';
}
function render(){
  topBar();
  if(view==='who') return renderWho();
  if(view==='start') return renderStart();
  if(view==='sum') return renderSum();
  if(view==='end') return renderEnd();
  if(view==='moons') return renderMoons();
  if(view==='grown') return renderGrown();
}
function wolfHero(size){ return `<div class="moonwolf"${size?` style="width:${size}"`:''}><div class="disc"></div><svg viewBox="0 0 120 104" aria-hidden="true"><use href="#wolf"/></svg></div>`; }

/* Who's playing? */
function renderWho(){
  const wm=lsGet('luna-word-moon-names',[]).filter(p=>p&&p.name&&!players.some(x=>x.name.toLowerCase()===String(p.name).toLowerCase()));
  stage.innerHTML=`<section class="hero">
    ${wolfHero('min(150px,40vw)')}
    <h1>Who’s playing?</h1>
    ${players.length?`<div class="plist">${players.map(p=>`<button class="pbtn" type="button" data-pid="${esc(p.id)}">🐺 ${esc(p.name)}</button>`).join('')}</div>`:''}
    ${wm.length?`<p class="hint" style="color:var(--muted)">From Word Moon:</p><div class="row center">${wm.map(p=>`<button class="soft" type="button" data-wm="${esc(p.name)}">+ ${esc(p.name)}</button>`).join('')}</div>`:''}
    <form class="padd" id="padd"><input id="pname" type="text" maxlength="30" placeholder="Type a name" aria-label="New name" autocomplete="off"><button class="big" type="submit">+ Add</button></form>
    <p class="vnote">Each name keeps its own moons, saved on this device.</p>
  </section>`;
  stage.querySelectorAll('[data-pid]').forEach(b=>b.onclick=()=>choosePlayer(b.dataset.pid));
  stage.querySelectorAll('[data-wm]').forEach(b=>b.onclick=()=>addPlayer(b.dataset.wm));
  $('#padd').onsubmit=ev=>{ ev.preventDefault(); addPlayer($('#pname').value); };
}
function choosePlayer(id){ hush(); clearTimers(); who=id; lsSet(WHO_KEY,id); loadLocal(id); chooseBrowserVoice(); sess=null; cur=null; view='start'; render(); }
function addPlayer(name){
  name=String(name||'').trim().slice(0,30); if(!name) return;
  let id=slugName(name), n=2; while(players.some(p=>p.id===id)) id=slugName(name)+'-'+(n++);
  players.push({id,name}); lsSet(NAMES_KEY,players);
  who=id; lsSet(WHO_KEY,id); state=blank(); sess=null; cur=null; save(); view='start'; render();
}
function removePlayer(id){
  players=players.filter(p=>p.id!==id); lsSet(NAMES_KEY,players);
  try{ localStorage.removeItem(STORE+':'+id); }catch(e){}
  if(who===id){ who=null; lsSet(WHO_KEY,null); state=blank(); }
}

function renderStart(){
  const full=SKILLS.filter(s=>phaseOf(s.id)===3).length;
  const now=kindsOn().map(k=>{ const st=STRANDS.find(s=>s.id===k), n=nextOf(k);
    return `<div class="nowcard">${moon(n?phaseOf(n.id):3)}<span><b>${st.emoji} ${esc(st.name)}</b>${n?esc(n.name):'All full moons!'}</span></div>`; }).join('');
  stage.innerHTML=`<section class="hero">
    <button class="small" id="sw" type="button">👤 ${esc(playerName())} · switch</button>
    ${wolfHero()}
    <h1>Luna's Maths Moon</h1>
    <p class="sub">${full?`You have ${full} full moon${full===1?'':'s'}!`:'Get sums right to fill each moon.'}</p>
    <button class="big" id="go" type="button">Start ▶</button>
    <div class="nowgrid" aria-label="Up next">${now}</div>
    <div class="row center"><button class="soft" id="mm" type="button">🌙 My moons</button><a class="soft" href="../word-moon/" style="text-decoration:none">📖 Word Moon</a></div>
    <p class="vnote">${esc(voiceNote())}</p>
  </section>`;
  $('#go').onclick=()=>begin(null);
  $('#sw').onclick=()=>{ hush(); view='who'; render(); };
  $('#mm').onclick=()=>openMoons('start');
}

function renderSum(){
  const q=cur.q, s=SK[q.skill], st=STRANDS.find(x=>x.id===s.strand), ph=phaseOf(q.skill);
  const shown = cur.answered ? (cur.ok ? `${sumText(q)} = ${q.ans}` : `${sumText(q)} = ${q.ans}`) : `${sumText(q)} = <span class="q">?</span>`;
  let answerHTML='';
  if(cur.mode==='buttons'){
    answerHTML=`<div class="choices">${cur.options.map(v=>{
      let cls=''; if(cur.answered){ if(v===q.ans) cls=' right'; else if(v===cur.given) cls=' wrong'; else cls=' fade'; }
      return `<button class="choice${cls}" type="button" data-v="${v}" ${cur.answered?'disabled':''}>${v}</button>`; }).join('')}</div>`;
  } else {
    const box = cur.answered ? (cur.ok ? q.ans : `<s style="color:var(--no)">${cur.given}</s>`) : (cur.typed || '<span class="ph">?</span>');
    answerHTML=`<div class="ansbox${cur.answered?(cur.ok?' right':' wrong'):''}" id="ansbox">${box}</div>`+
      (cur.answered?'':`<div class="pad">${['1','2','3','4','5','6','7','8','9'].map(k=>`<button class="key" type="button" data-k="${k}">${k}</button>`).join('')}
        <button class="key alt" type="button" data-k="back" aria-label="Delete">⌫</button><button class="key" type="button" data-k="0">0</button><button class="key go" type="button" data-k="ok" aria-label="Check" ${cur.typed?'':'disabled'}>✓</button></div>`);
  }
  let fb='';
  if(cur.answered && cur.ok){
    fb=`<div class="fb pop"><div class="say good">${esc(cur.praise||'That’s right!')}</div>${cur.moved?`<div class="move">${moon(cur.moved)} <b>${PHASE_NAME[cur.moved]}</b>: ${esc(s.name)}</div>`:''}</div>`;
  } else if(cur.answered){
    fb=`<div class="fb pop"><div class="say try">Good try! It’s ${q.ans}.</div>${helpHTML(q)}<p class="hint" style="color:var(--muted);font-size:15px">This one comes back soon.</p><button class="big" id="nextBtn" type="button">Next ▶</button></div>`;
  }
  stage.innerHTML=`<section class="stage">
    <div class="qhead"><div class="skilltag">${moon(ph)}<span>${st.emoji} ${esc(s.name)}</span>${pipsHTML(q.skill)}</div>
      ${cur.answered||ph>=3?'':`<button class="knowall" id="knowAll" type="button">⭐ I know it all</button>`}</div>
    ${q.again?'<span class="again-tag">Try again</span>':''}
    <div class="sum${cur.answered?(cur.ok?' right':' wrong'):''}" id="sumBox">${shown}</div>
    ${answerHTML}
    ${fb}
    ${cur.answered?'':'<button class="skipbtn" id="skipBtn" type="button">Skip this sum ⏭</button>'}
  </section>`;
  stage.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>answer(+b.dataset.v));
  stage.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>typeKey(b.dataset.k));
  const ka=$('#knowAll'); if(ka) ka.onclick=knowAll;
  const sk=$('#skipBtn'); if(sk) sk.onclick=skipSum;
  const nx=$('#nextBtn'); if(nx){ nx.onclick=nextOne; }
  requestAnimationFrame(fitSum);
}
function typeKey(k){
  if(!cur || cur.answered || cur.mode!=='pad') return;
  if(k==='ok'){ if(cur.typed) answer(cur.typed); return; }
  if(k==='back') cur.typed=cur.typed.slice(0,-1);
  else if(cur.typed.length<3) cur.typed=(cur.typed==='0'?'':cur.typed)+k;
  const box=$('#ansbox'); if(box) box.innerHTML=cur.typed||'<span class="ph">?</span>';
  const go=stage.querySelector('[data-k="ok"]'); if(go) go.disabled=!cur.typed;
}

/* After a miss: a picture or a short way to work it out. */
function dotsHTML(groups, size){
  /* groups: [{n, cls}] laid out in rows of 5, like a ten frame */
  const all=[]; groups.forEach(g=>{ for(let i=0;i<g.n;i++) all.push(g.cls||''); });
  const rows=[]; for(let i=0;i<all.length;i+=5){ const r=all.slice(i,i+5);
    rows.push('<div class="drow">'+r.map(c=>`<span class="d ${c}"></span>`).join('')+'</div>'); }
  return `<div class="dots" style="--ds:${size||18}px">${rows.join('')}</div>`;
}
function arrayHTML(rowsN, colsN){
  const size = colsN*rowsN>50 ? 10 : colsN>8||rowsN>8 ? 12 : 16;
  return `<div class="dots" style="--ds:${size}px;gap:${size<12?3:5}px">${Array.from({length:rowsN},()=>'<div class="drow">'+Array.from({length:colsN},()=>'<span class="d"></span>').join('')+'</div>').join('')}</div>`;
}
function countHTML(step, to){ const c=[]; for(let v=step; v<=to; v+=step) c.push(`<span class="${v===to?'end':''}">${v}</span>`); return `<div class="count">${c.join('')}</div>`; }
function helpHTML(q){
  const {a,b,ans,op}=q, eq=`<div class="eq">${sumText(q)} = ${ans}</div>`;
  if(op==='+'){
    if(a<=10 && b<=10) return `<div class="help"><div class="dgroups">${dotsHTML([{n:a}])}<span>+</span>${dotsHTML([{n:b,cls:'b'}])}</div><p>${a} and ${b} more makes ${ans}.</p>${eq}</div>`;
    if(a%10===0 && b%10===0) return `<div class="help"><p>${a/10} tens + ${b/10} tens = ${ans/10} tens.</p>${eq}</div>`;
    const big=Math.max(a,b), small=Math.min(a,b);
    if(small<10){ const ones=big%10, toTen=10-ones;
      if(ones+small<10) return `<div class="help"><p>Add the ones: ${ones} + ${small} = ${ones+small}.</p>${eq}</div>`;
      return `<div class="help"><p>${big} + ${toTen} = ${big+toTen}, then ${small-toTen} more is ${ans}.</p>${eq}</div>`; }
    const t=Math.floor(a/10)*10+Math.floor(b/10)*10, o=a%10+b%10;
    return `<div class="help"><p>Tens: ${Math.floor(a/10)*10} + ${Math.floor(b/10)*10} = ${t}.<br>Ones: ${a%10} + ${b%10} = ${o}.<br>${t} + ${o} = ${ans}.</p>${eq}</div>`;
  }
  if(op==='-'){
    if(a<=20) return `<div class="help">${dotsHTML([{n:ans},{n:b,cls:'x'}])}<p>Start with ${a}, take away ${b}. ${ans} are left.</p>${eq}</div>`;
    if(a%10===0 && b%10===0) return `<div class="help"><p>${a/10} tens − ${b/10} tens = ${ans/10} tens.</p>${eq}</div>`;
    if(b<10){ const ones=a%10;
      if(b<=ones) return `<div class="help"><p>Take the ones: ${ones} − ${b} = ${ones-b}.</p>${eq}</div>`;
      return `<div class="help"><p>${a} − ${ones} = ${a-ones}, then take ${b-ones} more: ${ans}.</p>${eq}</div>`; }
    const tens=Math.floor(b/10)*10, mid=a-tens;
    return `<div class="help"><p>Take the tens: ${a} − ${tens} = ${mid}.<br>Then the ones: ${mid} − ${b%10} = ${ans}.</p>${eq}</div>`;
  }
  if(op==='x'){ const n=SK[q.skill].n, k=a===n?b:a;
    return `<div class="help">${arrayHTML(k,n)}<p>${k} lot${k===1?'':'s'} of ${n}. Count in ${n}s:</p>${countHTML(n,ans)}${eq}</div>`; }
  /* dividing */
  return `<div class="help"><p>How many ${b}s make ${a}? Count in ${b}s:</p>${countHTML(b,a)}<p>That’s ${ans} lot${ans===1?'':'s'} of ${b}.</p>${arrayHTML(ans,b)}${eq}</div>`;
}

function renderEnd(){
  const ups=SKILLS.filter(s=>sess && phaseOf(s.id)>sess.start[s.id]).map(s=>`<span class="chip">${moon(phaseOf(s.id))} ${esc(s.name)}</span>`).join('');
  stage.innerHTML=`<section class="hero">
    ${wolfHero('min(180px,46vw)')}
    <h1>Done for today!</h1>
    <p class="sub">${sess&&sess.done>(sess.skipped||0)?`${sess.right} right out of ${sess.done-(sess.skipped||0)}.`:''}${ups?' Your moons grew:':''}</p>
    ${ups?`<div class="chips">${ups}</div>`:''}
    <div class="row center"><button class="big" id="again" type="button">One more round</button></div>
    <div class="row center"><button class="soft" id="mm" type="button">🌙 My moons</button><button class="soft" id="home" type="button">Finish</button></div>
  </section>`;
  $('#again').onclick=()=>begin(sess&&sess.only);
  $('#mm').onclick=()=>openMoons('end');
  $('#home').onclick=()=>{ hush(); sess=null; view='start'; render(); };
}

/* My moons: every skill, grouped by kind. Tap one to practise it, or to say "I know it all". */
let moonsFrom='start', popSkill=null, startArmed=null;
function openMoons(from){ hush(); clearTimers(); moonsFrom=from; popSkill=null; view='moons'; render(); window.scrollTo(0,0); }
function renderMoons(){
  stage.innerHTML=`<section class="stage" style="align-items:flex-start;text-align:left"><h2>🌙 My moons</h2><p style="color:var(--muted);font-size:16px">Tap a moon to practise it.</p></section>
    ${STRANDS.map(st=>{ const nx=nextOf(st.id);
      return `<div class="strand"><h3>${st.emoji} ${esc(st.name)}</h3><div class="sgrid">${SKILLS.filter(s=>s.strand===st.id).map(s=>{ const ph=phaseOf(s.id);
        return `<button class="scard${ph===3?' full':''}${nx&&nx.id===s.id?' next':''}" type="button" data-sk="${s.id}">${moon(ph)}<b>${esc(s.name)}</b><small>${esc(s.ex)}</small><small>${nx&&nx.id===s.id?'Up next · ':''}${PHASE_NAME[ph]}</small></button>`; }).join('')}</div></div>`; }).join('')}
    <div class="row"><button class="big" id="back" type="button">← Back</button></div>
    ${popSkill?popHTML(popSkill):''}`;
  stage.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{ popSkill=b.dataset.sk; startArmed=null; render(); });
  $('#back').onclick=closeMoons;
  if(popSkill){
    const id=popSkill;
    $('#wpop').onclick=ev=>{ if(ev.target.id==='wpop'){ popSkill=null; render(); } };
    $('#pPrac').onclick=()=>{ popSkill=null; begin(id); };
    const ka=$('#pKnow'); if(ka) ka.onclick=()=>{ const r=rec(id); r.pts=FULL; r.trusted=1; save(); toast('⭐ '+SK[id].name+': full moon!','full'); popSkill=null; render(); };
    const ag=$('#pAgain'); if(ag) ag.onclick=()=>{ if(startArmed!==id){ startArmed=id; render(); return; } startArmed=null; state.skills[id]={pts:0,right:0,wrong:0,trusted:0,last:0}; save(); popSkill=null; render(); };
    $('#pClose').onclick=()=>{ popSkill=null; render(); };
  }
}
function popHTML(id){
  const s=SK[id], ph=phaseOf(id), r=state.skills[id];
  return `<div class="wpop" id="wpop"><div class="popcard pop" role="dialog" aria-label="${esc(s.name)}">
    ${moon(ph)}<h2>${esc(s.name)}</h2><div class="ex">${esc(s.ex)}</div>
    <p style="color:var(--muted)">${PHASE_NAME[ph]}${ph<3?` · ${ptsOf(id)} of ${FULL} right to a full moon`:''}${r&&r.trusted?' · you said you know it':''}</p>
    <button class="big" id="pPrac" type="button">▶ Practise this</button>
    <div class="row center">${ph<3?'<button class="knowall" id="pKnow" type="button">⭐ I know it all</button>':''}<button class="soft" id="pClose" type="button">✕ Close</button></div>
    ${ptsOf(id)>0?`<button class="small${startArmed===id?' danger':''}" id="pAgain" type="button">${startArmed===id?'Tap again to empty this moon':'Start this moon again'}</button>`:''}
  </div></div>`;
}
function closeMoons(){
  popSkill=null;
  if(moonsFrom==='sum' && sess && cur){ view='sum'; render(); if(!cur.answered) say(['What is '+sumSpeech(cur.q)+'?']); else if(cur.ok) later(nextOne,800); return; }
  if(moonsFrom==='end' && sess){ view='end'; render(); return; }
  view=who?'start':'who'; render();
}

/* =================== Grown-ups =================== */
let resetArmed=false, whoArmed=null, restoreArmed=null, afterGrown=null;
function renderGrown(){
  const dvList=deviceVoices().filter(v=>voiceScore(v)>-50).slice(0,12);
  const days=Object.keys(state.days).sort().slice(-7).reverse();
  stage.innerHTML=`<section class="stage" style="align-items:flex-start;text-align:left"><h2>Grown-ups</h2></section>
  <div class="panel"><h3>How it works</h3>
    <p>One sum at a time. The four kinds take turns (adding, taking away, times tables, dividing), each at its next skill. A new skill has three big answer buttons; once she has ${STEP} right it switches to a number pad.</p>
    <p>Moon: ${moon(0)} new → ${moon(1)} ${STEP} right → ${moon(2)} ${2*STEP} right → ${moon(3)} ${FULL} right. A miss takes one step back, but never below the moon she already has. A missed sum shows a picture or a way to work it out, and comes back 3 sums later.</p>
    <p>⭐ I know it all makes the skill a full moon at once (trusted, no test) and doesn't use up the round. Skip moves on with no credit. In 🌙 My moons she can practise any skill.</p>
    <p>Progress is saved on this device, per name. To move it to another phone or browser, use Backup below.</p></div>
  <div class="panel"><h3>Luna's voice</h3><p>${esc(voiceNote())}</p>
    ${dvList.length?`<p>Pick the voice that sounds best on this device (tap to hear it):</p><div class="row">${dvList.map((v,i)=>`<button class="pill" type="button" data-dv="${i}" aria-pressed="${bVoice===v}">${esc(shortVoice(v))}</button>`).join('')}</div>`:''}
    ${betterVoiceTips()}
    <label class="row"><span style="color:var(--muted);font-size:15px">Speed</span><input type="range" id="rate" min="0.7" max="1.2" step="0.05" value="${state.rate}"></label>
    <div class="row"><button class="pill" type="button" id="soundT" aria-pressed="${state.sound}">Sound ${state.sound?'on':'off'}</button></div></div>
  <div class="panel"><h3>Sums in a round</h3><div class="row">${[8,12,16,24].map(n=>`<button class="pill" type="button" data-per="${n}" aria-pressed="${state.perRound===n}">${n}</button>`).join('')}</div></div>
  <div class="panel"><h3>Kinds of sums</h3><p>Turn a kind off to leave it out of rounds. It can still be practised from My moons.</p>
    <div class="row">${STRANDS.map(s=>`<button class="pill" type="button" data-kind="${s.id}" aria-pressed="${!!state.kinds[s.id]}">${s.emoji} ${esc(s.name)}</button>`).join('')}</div></div>
  <div class="panel"><h3>Her moons</h3><div class="slist">${SKILLS.map(s=>{ const r=state.skills[s.id]; const ph=phaseOf(s.id);
      return `<div>${moon(ph)} <b>${esc(s.name)}</b> <span>${PHASE_NAME[ph]}${r?` · ${r.right} right, ${r.wrong} missed${r.trusted?' · said “I know it all”':''}`:''}</span></div>`; }).join('')}</div>
    ${days.length?`<p>Last days: ${days.map(d=>`${d.slice(5)}: ${state.days[d].right}/${state.days[d].n}`).join(' · ')}</p>`:''}</div>
  <div class="panel"><h3>Backup</h3><p>A backup code holds every name’s moons. Copy it to keep progress safe, or to move it to another phone or browser: open Maths Moon there, paste the code below and tap Load backup.</p>
    <div class="row"><button class="pill" type="button" id="bkCopy">Copy backup code</button><span id="bkMsg" style="color:var(--muted);font-size:14px"></span></div><div id="bkBox"></div>
    <textarea id="bkIn" placeholder="Paste a backup code here" aria-label="Backup code to load"></textarea>
    <div class="row"><button class="pill${restoreArmed?' danger':''}" type="button" id="bkLoad">${restoreArmed?esc(restoreArmed.msg):'Load backup'}</button></div></div>
  <div class="panel"><h3>Names</h3><p>Playing now: <b>${esc(playerName())}</b>. Each name keeps its own moons on this device.</p>
    <div class="row">${players.map(p=>`<button class="pill${whoArmed===p.id?' danger':''}" type="button" data-rm="${esc(p.id)}">${whoArmed===p.id?'Tap again to remove '+esc(p.name):'Remove '+esc(p.name)}</button>`).join('')}</div></div>
  <div class="panel"><h3>Start again</h3><div class="row"><button class="pill danger" type="button" id="reset">${resetArmed?'Tap again to empty every moon':'Wipe this name’s progress'}</button></div></div>
  <div class="row"><button class="big" id="back" type="button">← Back</button></div>`;

  stage.querySelectorAll('[data-dv]').forEach(b=>b.onclick=()=>{ const v=dvList[+b.dataset.dv]; if(!v) return; bVoice=v; state.deviceVoice=v.name; save(); render(); browserSay(['Hi! I’m Luna. What is 3 plus 4?']); });
  $('#rate').onchange=ev=>{ state.rate=+ev.target.value; save(); say(['This is my new speed.'],{noRemember:true}); };
  $('#soundT').onclick=()=>{ state.sound=!state.sound; if(!state.sound) hush(); save(); render(); };
  stage.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{ state.perRound=+b.dataset.per; if(sess) sess.limit=state.perRound; save(); render(); });
  stage.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{ const k=b.dataset.kind; state.kinds[k]=!state.kinds[k]; if(!STRANDS.some(s=>state.kinds[s.id])) state.kinds[k]=true; save(); render(); });
  $('#bkCopy').onclick=()=>{ const txt=backupCode(); const done=()=>{ $('#bkMsg').textContent='Copied. Keep it somewhere safe, like an email to yourself.'; };
    try{ navigator.clipboard.writeText(txt).then(done,()=>bkShow(txt)); }catch(e){ bkShow(txt); } };
  if(restoreArmed) $('#bkIn').value=restoreArmed.code;
  $('#bkLoad').onclick=()=>{ const code=$('#bkIn').value; const d=readBackup(code);
    if(!d){ restoreArmed=null; render(); $('#bkMsg').textContent='That isn’t a Maths Moon backup code. Copy the whole code and try again.'; return; }
    if(!restoreArmed || restoreArmed.code!==code){ const same=d.players.filter(p=>players.some(x=>x.name.toLowerCase()===String(p.name).toLowerCase())).map(p=>p.name);
      restoreArmed={code, msg: same.length?'Tap again: replaces progress for '+same.join(', '):'Tap again to add '+d.players.map(p=>p.name).join(', ')}; render(); return; }
    restoreArmed=null; const n=loadBackup(d); render(); $('#bkMsg').textContent='Loaded '+n+' name'+(n===1?'':'s')+'.'; };
  stage.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ const id=b.dataset.rm; if(whoArmed!==id){ whoArmed=id; render(); return; } whoArmed=null; removePlayer(id); if(!who){ afterGrown=null; view='who'; } render(); });
  $('#reset').onclick=()=>{ if(!resetArmed){ resetArmed=true; render(); return; }
    const keep={rate:state.rate,sound:state.sound,perRound:state.perRound,deviceVoice:state.deviceVoice,kinds:state.kinds};
    state=Object.assign(blank(),keep); resetArmed=false; cur=null; sess=null; afterGrown=null; save(); render(); };
  $('#back').onclick=closeGrown;
}
/* How to get a nicer voice on each kind of device. */
function betterVoiceTips(){
  const ua=navigator.userAgent||'';
  const android=/Android/i.test(ua), apple=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/i.test(ua)&&navigator.maxTouchPoints>1), mac=/Macintosh/i.test(ua)&&!apple, edge=/Edg\//.test(ua);
  const tips=[];
  if(android) tips.push('<b>Android:</b> open Settings, search “Text-to-speech”, choose <i>Speech Services by Google</i>, tap ⚙ › Install voice data › English (United Kingdom or Australia), and download a voice. Then close and reopen this page and pick it here.');
  if(apple) tips.push('<b>iPhone or iPad:</b> Settings › Accessibility › Spoken Content › Voices › English. Download one marked <i>Enhanced</i> or <i>Premium</i>, then reopen this page.');
  if(mac) tips.push('<b>Mac:</b> System Settings › Accessibility › Spoken Content › System voice › Manage Voices. Download one marked <i>Premium</i>, then reopen this page.');
  if(!android && !apple && !edge) tips.push('<b>Computer:</b> Microsoft Edge has the most natural voices (their names say “Natural” or “Online”). Open this page in Edge to use them.');
  if(edge) tips.push('Voices with “Natural” or “Online” in the name sound the most like a real person.');
  return `<details class="vtips"><summary>Get a nicer voice</summary>${tips.map(t=>`<p>${t}</p>`).join('')}</details>`;
}
/* Backup codes: every name's progress in one piece of text. */
function backupCode(){
  save();
  const all=players.map(p=>({id:p.id, name:p.name, state:p.id===who?state:lsGet(STORE+':'+p.id,null)})).filter(x=>x.state);
  const json=JSON.stringify({app:'maths-moon', v:1, at:Date.now(), players:all});
  return 'MATHSMOON1:'+btoa(unescape(encodeURIComponent(json)));
}
function readBackup(code){
  const m=String(code||'').replace(/\s+/g,'').match(/MATHSMOON1:([A-Za-z0-9+\/=]+)/); if(!m) return null;
  try{ const d=JSON.parse(decodeURIComponent(escape(atob(m[1])))); return d && Array.isArray(d.players) && d.players.length ? d : null; }catch(e){ return null; }
}
function loadBackup(d){
  let n=0;
  d.players.forEach(p=>{ const st=migrate(p.state); const name=String(p.name||'').trim().slice(0,30); if(!st||!name) return;
    let ex=players.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!ex){ let id=slugName(name), k=2; while(players.some(x=>x.id===id)) id=slugName(name)+'-'+(k++); ex={id,name}; players.push(ex); }
    lsSet(STORE+':'+ex.id, st); n++; });
  lsSet(NAMES_KEY,players);
  if(who) loadLocal(who);
  return n;
}
function bkShow(txt){ $('#bkBox').innerHTML='<textarea readonly></textarea>'; const t=$('#bkBox textarea'); t.value=txt; t.focus(); t.select(); $('#bkMsg').textContent='Select all and copy.'; }
function openGrown(){ clearTimers(); hush(); afterGrown={view}; resetArmed=false; whoArmed=null; view='grown'; render(); window.scrollTo(0,0); }
function closeGrown(){
  const a=afterGrown||{view:'start'}; afterGrown=null;
  if(!who){ view='who'; return render(); }
  if(a.view==='sum' && sess && cur){ view='sum'; render(); if(cur.answered){ if(cur.ok) later(nextOne,800); } else say(['What is '+sumSpeech(cur.q)+'?']); return; }
  if(a.view==='end' && sess){ view='end'; return render(); }
  if(a.view==='moons'){ view='moons'; return render(); }
  view='start'; render();
}

/* hold to open (stops her opening it by accident); Enter or Space also opens it */
(function(){
  const b=$('#grownBtn'), fill=$('#grownFill'); let t0=0, raf=0;
  const stop=()=>{ cancelAnimationFrame(raf); t0=0; fill.style.width='0'; };
  const step=()=>{ const p=Math.min(1,(performance.now()-t0)/1200); fill.style.width=(p*100)+'%'; if(p>=1){ stop(); if(view!=='grown') openGrown(); } else raf=requestAnimationFrame(step); };
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); t0=performance.now(); raf=requestAnimationFrame(step); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener('click',e=>{ if(e.detail===0 && view!=='grown') openGrown(); });
  b.addEventListener('contextmenu',e=>e.preventDefault());
})();
$('#hearBtn').onclick=()=>{ if(lastLines.length) say(lastLines,{noRemember:true}); };
$('#stopBtn').onclick=hush;
$('#exitBtn').onclick=()=>{ hush(); clearTimers(); if(sess) finishRound(); else { view='start'; render(); } };
$('#moonsBtn').onclick=()=>{ if(view==='sum'){ clearTimers(); } openMoons(view==='sum'?'sum':view); };

/* keyboard: digits, Backspace and Enter on the number pad; Enter for Next */
document.addEventListener('keydown',ev=>{
  if(ev.ctrlKey||ev.metaKey||ev.altKey) return;
  if(ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
  if(view==='moons' && popSkill && ev.key==='Escape'){ ev.preventDefault(); popSkill=null; render(); return; }
  if(view!=='sum'||!cur) return;
  if(cur.answered){ if(ev.key==='Enter' && !cur.ok){ ev.preventDefault(); nextOne(); } return; }
  if(cur.mode==='pad'){
    if(/^[0-9]$/.test(ev.key)){ ev.preventDefault(); typeKey(ev.key); }
    else if(ev.key==='Backspace'){ ev.preventDefault(); typeKey('back'); }
    else if(ev.key==='Enter'){ ev.preventDefault(); typeKey('ok'); }
  }
});
/* the sum shrinks to fit on one line on a small phone */
function fitSum(){
  const el=$('#sumBox'); if(!el) return;
  el.style.fontSize=''; let fs=parseFloat(getComputedStyle(el).fontSize), n=0;
  while(el.scrollWidth>el.clientWidth+1 && fs>24 && n<40){ fs*=0.92; el.style.fontSize=fs+'px'; n++; }
}
window.addEventListener('resize',()=>requestAnimationFrame(fitSum));

/* offline helper on the website (not when opened as a file) */
const SW_VERSION='202611150056';
if('serviceWorker' in navigator && location.protocol==='https:'){ addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js?v='+SW_VERSION).catch(()=>{}); }); }

appReady=true;
view=who?'start':'who';
render();
})();
