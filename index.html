<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080B">
<meta name="description" content="A maths game: adding, taking away, times tables, dividing, fractions and decimals. Fill the moon.">
<title>Luna's Maths Moon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maths Moon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Lexend:wght@400;700&display=swap">
<style>
/* Same night sky as Word Moon: plain black, one sum at a time. No pink anywhere.
   Each skill fills a moon: new -> crescent (4 right) -> half (8) -> full (12). */
:root{
  --bg:#07080B; --panel:#12151B; --panel2:#1A1E26; --line:#2C323D; --line2:#454D5B;
  --ink:#F5F1E6; --muted:#9BA5B1;
  --moon:#F4D26B; --moon-soft:#352E1B;
  --good:#3FC872; --good-soft:#123020; --no:#E5383B; --no-soft:#3A1415;
  --try:#FF9F1C; --try-soft:#3A2610;
  --c1:#FF9F1C; --c2:#9D7BFF; --blue:#2F9BFF;
  --font-display:'Sniglet','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{max-width:780px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
h1,h2,h3{font-family:var(--font-display);font-weight:800;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--moon);outline-offset:3px}

.top{display:flex;align-items:center;gap:10px;min-height:48px}
.spacer{flex:1}
.iconbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line);font-size:22px;flex:none}
.grown{position:relative;overflow:hidden;font-size:13px;color:var(--muted);padding:8px 12px;border-radius:999px;border:1px solid var(--line);flex:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.grown .fill{position:absolute;inset:0;width:0;background:var(--moon-soft);z-index:0}
.grown span{position:relative}
.exitbtn{flex:none;font-size:15px;font-weight:700;padding:10px 14px;border-radius:999px;border:2px solid var(--line2);color:var(--ink);background:var(--panel2)}
.rprog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.rprog span{flex:none;font-weight:700;color:var(--ink)}
.rbar{flex:1;height:8px;border-radius:99px;background:var(--panel2);overflow:hidden} .rbar i{display:block;height:100%;width:0;background:var(--moon);transition:width .3s}
.snd{margin:0;background:var(--try-soft);border:1px solid var(--try);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:15px}
main{flex:1;display:flex;flex-direction:column;gap:20px}

.mn{width:1em;height:1em;vertical-align:-0.14em;flex:none}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:3vh}
.moonwolf{position:relative;width:min(220px,56vw);aspect-ratio:1;max-width:100%}
.moonwolf .disc{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle at 38% 34%,#FFF4C8 0%,var(--moon) 55%,#D9B24B 100%);box-shadow:0 0 60px 10px rgba(244,210,107,.18)}
.moonwolf svg{position:absolute;left:18%;bottom:-2%;width:64%;height:auto}
.hero h1{font-size:clamp(32px,7vw,50px)}
.hero .sub{color:var(--muted);font-size:17px;max-width:34ch}
.vnote{color:var(--muted);font-size:14px;max-width:40ch}
.big{font-family:var(--font-display);font-size:28px;font-weight:800;padding:16px 40px;border-radius:999px;background:var(--moon);color:#1B1606;box-shadow:0 0 0 6px var(--moon-soft)}
.big[disabled]{opacity:.5;cursor:default}
.soft{font-family:var(--font-display);font-size:20px;padding:12px 24px;border-radius:999px;border:2px solid var(--line2);color:var(--ink)}
.small{font-size:15px;color:var(--muted);padding:8px 16px;border-radius:999px;border:1px solid var(--line2)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.center{justify-content:center}
.nowgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:520px}
.nowcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;text-align:left;min-width:0}
.nowcard .mn{font-size:34px}
.nowcard b{display:block;font-size:13px;color:var(--muted);font-weight:400}
.nowcard span{font-size:16px;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:16px;display:inline-flex;gap:6px;align-items:center}

/* one sum */
.stage{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.qhead{display:flex;align-items:center;gap:10px;width:100%;flex-wrap:wrap}
.skilltag{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);flex:1;min-width:0;text-align:left}
.skilltag .mn{font-size:26px}
.pips{display:flex;gap:3px} .pips i{width:10px;height:10px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2)} .pips i.on{background:var(--moon);border-color:var(--moon)}
.knowall{font-family:var(--font-display);font-weight:800;font-size:17px;padding:10px 16px;border-radius:999px;background:var(--blue);color:#04121F;box-shadow:0 0 0 4px rgba(47,155,255,.25);flex:none}
.again-tag{font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 12px;border-radius:999px;border:2px solid var(--c2);color:var(--c2)}
.sum{font-family:var(--font-display);font-weight:800;font-size:clamp(44px,13vw,100px);line-height:1.1;padding:10px 26px;border-radius:24px;background:var(--panel);border:2px solid var(--line);max-width:100%;white-space:nowrap;overflow:hidden}
.sum .q{color:var(--moon)}
.sum.right{border-color:var(--good)} .sum.wrong{border-color:var(--no)}
.ansbox{min-width:160px;min-height:76px;padding:6px 22px;border-radius:18px;background:var(--panel);border:2px solid var(--line);border-bottom:4px solid var(--moon);font-family:var(--font-display);font-weight:800;font-size:52px;line-height:1.2;display:flex;align-items:center;justify-content:center;letter-spacing:.04em}
.ansbox.right{border-color:var(--good)} .ansbox.wrong{border-color:var(--no)}
.ansbox .ph{color:var(--line2)}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:520px}
.choice{min-height:96px;border-radius:22px;background:var(--panel2);border:3px solid var(--line2);font-family:var(--font-display);font-weight:800;font-size:clamp(36px,10vw,52px)}
.choice:active{transform:scale(.96)}
.choice.right{border-color:var(--good);background:var(--good-soft)} .choice.wrong{border-color:var(--no);background:var(--no-soft)} .choice.fade{opacity:.35}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:340px}
.key{height:62px;border-radius:14px;background:#F5F1E6;color:#16181D;font-weight:700;font-size:30px;box-shadow:0 4px 0 #9BA5B1;touch-action:manipulation}
.key:active{transform:translateY(2px);box-shadow:0 2px 0 #9BA5B1}
.key.alt{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 #000;border:1px solid var(--line2);font-size:24px}
.key.go{background:var(--good);color:#04140A;box-shadow:0 4px 0 #1E7A44}
.key[disabled]{opacity:.4}
.skipbtn{font-size:16px;color:var(--muted);padding:8px 18px;border-radius:999px;border:1px solid var(--line2)}
.fb{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;width:100%}
.fb .say{font-family:var(--font-display);font-size:30px}
.fb .say.good{color:var(--good)} .fb .say.try{color:var(--try)}
.fb .move{font-size:18px} .fb .move b{color:var(--moon)}
.help{background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:520px;width:100%}
.help p{font-size:20px}
.help .eq{font-family:var(--font-display);font-size:30px;color:var(--moon)}
.dots{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.drow{display:flex;gap:inherit}
.d{width:var(--ds,16px);height:var(--ds,16px);border-radius:50%;background:var(--c1);flex:none}
.d.b{background:var(--c2)} .d.x{background:transparent;border:2px dashed var(--line2)}
.gap{width:10px}
.dgroups{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.dgroups>span{font-family:var(--font-display);font-size:30px;color:var(--muted)}
.count{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.count span{font-size:16px;padding:2px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.count span.end{border-color:var(--moon);color:var(--moon);font-weight:700}

/* My moons */
.strand{display:flex;flex-direction:column;gap:10px}
.strand h3{font-size:22px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));gap:10px}
.scard{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:12px 8px;border-radius:16px;background:var(--panel);border:1px solid var(--line);min-width:0}
.scard .mn{font-size:40px}
.scard b{font-size:15px;line-height:1.25}
.scard small{color:var(--muted);font-size:13px}
.scard.next{border:2px solid var(--c2)}
.scard.full{border-color:var(--moon)}
.wpop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px}
.popcard{background:var(--panel);border:2px solid var(--line2);border-radius:24px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px;width:min(460px,100%);text-align:center}
.popcard .mn{font-size:64px}
.popcard .big{font-size:24px;padding:14px 30px}
.popcard .ex{font-family:var(--font-display);font-size:34px;color:var(--moon)}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));translate:-50% -140%;z-index:50;background:var(--panel2);border:2px solid var(--moon);color:var(--ink);border-radius:999px;padding:10px 18px;font-family:var(--font-display);font-size:18px;transition:translate .3s ease;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{translate:-50% 0}

/* names */
.plist{display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
.pbtn{font-family:var(--font-display);font-size:24px;padding:14px 20px;border-radius:18px;background:var(--panel2);border:2px solid var(--line2);text-align:left}
.pbtn:hover{border-color:var(--moon)}
.padd{display:flex;gap:10px;width:min(420px,100%);flex-wrap:wrap;justify-content:center}
.padd input{flex:1;min-width:0;font:inherit;font-size:20px;padding:12px 16px;border-radius:999px;border:2px solid var(--line2);background:var(--panel);color:var(--ink)}
.padd .big{font-size:22px;padding:12px 24px}

/* grown-ups */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:22px}
.panel p{color:var(--muted);font-size:16px}
.vtips{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2)}
.vtips summary{cursor:pointer;font-weight:700;color:var(--moon)}
.vtips p{margin-top:8px}
.pill{padding:8px 14px;border-radius:999px;border:2px solid var(--line);font-size:15px}
.pill[aria-pressed="true"]{border-color:var(--moon);background:var(--moon-soft)}
.danger{border-color:var(--no);color:var(--no)}
.slist{display:flex;flex-direction:column;gap:6px;font-size:15px}
.slist div{display:flex;gap:8px;align-items:center}
.slist span{color:var(--muted)}
textarea{width:100%;min-height:72px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;font:14px/1.4 ui-monospace,Consolas,monospace}
input[type=range]{width:min(320px,100%);accent-color:var(--moon)}
/* fractions and decimals */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-size:.62em;margin:0 .08em}
.fr b{display:block;border-bottom:.12em solid currentColor;padding:0 .14em .06em;font-weight:inherit}
.fr>span{display:block;padding-top:.06em}
.fbars{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.fbar{display:flex;width:min(320px,90%);height:34px;border:2px solid var(--line2);border-radius:8px;overflow:hidden;flex:none}
.fbar i{flex:1;border-left:2px solid var(--line2)} .fbar i:first-child{border-left:0}
.fbar i.a{background:var(--c1)} .fbar i.b{background:var(--c2)}
.fbar i.x{background:repeating-linear-gradient(45deg,rgba(255,159,28,.45) 0 5px,transparent 5px 11px)}
.key.wide3{grid-column:span 3}
/* show me how, tips */
.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.toolbtn{font-family:var(--font-display);font-size:18px;padding:10px 18px;border-radius:999px;border:2px solid var(--c2);color:var(--ink);background:var(--panel)}
.toolbtn.tip{border-color:var(--moon)}
.teach{border-color:var(--c2)}
.teach h3{font-size:22px;color:var(--c2)}
.help .lines{display:flex;flex-direction:column;gap:6px;text-align:center}
.tipcard{text-align:left;align-items:stretch}
.tipcard h2{text-align:center}
.tipcard ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:10px;font-size:18px}
.life{background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:10px 14px;font-size:17px}
.life b{color:var(--moon)}
/* speed practice */
.speedbtn{font-family:var(--font-display);font-weight:800;font-size:20px;padding:12px 22px;border-radius:999px;background:var(--blue);color:#04121F;box-shadow:0 0 0 4px rgba(47,155,255,.25)}
.stat{font-family:var(--font-display);font-size:clamp(30px,8vw,44px);color:var(--moon)}
.badges{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 14px;border-radius:18px;background:var(--panel);border:2px solid var(--moon);min-width:120px;max-width:170px;text-align:center}
.badge span{font-size:44px;line-height:1.1} .badge b{font-size:15px;line-height:1.25}
.shelf{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:26px}
.shelf span{display:inline-flex;align-items:flex-end;gap:1px} .shelf small{font-size:12px;color:var(--muted)}
.recent{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:15px;color:var(--muted)}
.recent span{padding:2px 10px;border-radius:999px;border:1px solid var(--line)} .recent span.now{border-color:var(--moon);color:var(--moon)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.key{height:56px}.choice{min-height:84px}.sum{padding:8px 16px}.qhead .knowall{font-size:15px;padding:8px 12px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="wolf" viewBox="0 0 120 104">
    <path d="M20 46 L28 4 L54 30 Z M100 46 L92 4 L66 30 Z" fill="#6F7D8A" stroke="#22323B" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M27 36 L31 14 L45 29 Z M93 36 L89 14 L75 29 Z" fill="#C9B79C"/>
    <path d="M60 18 C30 18 14 38 14 58 C14 70 22 78 30 82 L22 92 L42 88 C48 94 54 96 60 96 C66 96 72 94 78 88 L98 92 L90 82 C98 78 106 70 106 58 C106 38 90 18 60 18 Z" fill="#8E9BA8" stroke="#22323B" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M60 30 C54 40 52 52 50 62 L70 62 C68 52 66 40 60 30 Z" fill="#E9EDF1"/>

    <circle cx="76" cy="54" r="6.5" fill="#E8A33B" stroke="#22323B" stroke-width="2"/><circle cx="76" cy="54" r="3.2" fill="#22323B"/><circle cx="77.5" cy="52.5" r="1.2" fill="#fff"/>

<div class="app">
  <header class="top">
    <button class="exitbtn" id="exitBtn" type="button" hidden>✕ Stop</button>
    <div class="spacer"></div>
    <button class="iconbtn" id="stopBtn" type="button" aria-label="Stop talking" hidden>■</button>
    <button class="iconbtn" id="hearBtn" type="button" aria-label="Hear it again" hidden>🔊</button>
    <button class="iconbtn" id="moonsBtn" type="button" aria-label="My moons">🌙</button>
    <button class="grown" id="grownBtn" type="button" aria-label="Grown-ups page. Press and hold to open."><i class="fill" id="grownFill"></i><span>Grown-ups (hold)</span></button>
  </header>
  <div class="rprog" id="rprog" hidden><span id="rtext"></span><div class="rbar"><i id="rbar"></i></div></div>
  <p class="snd" id="snd" role="status" hidden></p>
  <main id="stage" aria-live="polite"></main>
</div>

<script>
(function(){
'use strict';
/* =================== Skills ===================
   Six kinds of sums, each a ladder of skills from easiest to hardest.
   A round mixes the next skill of each kind (the first one that isn't a full moon yet). */
const STRANDS=[
  {id:'add',  name:'Adding',       emoji:'➕'},
  {id:'sub',  name:'Taking away',  emoji:'➖'},
  {id:'times',name:'Times tables', emoji:'✖️'},
  {id:'div',  name:'Dividing',     emoji:'➗'},
  {id:'frac', name:'Fractions',    emoji:'🍕'},
  {id:'dec',  name:'Decimals',     emoji:'📏'}
];
const SKILLS=[
  {id:'add10',   strand:'add', name:'Adding to 10',          ex:'4 + 5'},
  {id:'add20',   strand:'add', name:'Adding to 20',          ex:'8 + 7'},
  {id:'addtens', strand:'add', name:'Adding tens',           ex:'30 + 40'},
  {id:'add2d1d', strand:'add', name:'Adding to 100',         ex:'34 + 5'},
  {id:'add2d2d', strand:'add', name:'Two big numbers',       ex:'23 + 45'},
  {id:'sub10',   strand:'sub', name:'Taking away in 10',     ex:'9 − 4'},
  {id:'sub20',   strand:'sub', name:'Taking away in 20',     ex:'15 − 8'},
  {id:'subtens', strand:'sub', name:'Taking away tens',      ex:'70 − 30'},
  {id:'sub2d1d', strand:'sub', name:'Taking away in 100',    ex:'43 − 7'},
  {id:'sub2d2d', strand:'sub', name:'Two big numbers',       ex:'65 − 23'},
  {id:'t2',  strand:'times', name:'2 times table',  n:2,  ex:'2 × 6'},
  {id:'t5',  strand:'times', name:'5 times table',  n:5,  ex:'5 × 4'},
  {id:'t10', strand:'times', name:'10 times table', n:10, ex:'10 × 3'},
  {id:'t3',  strand:'times', name:'3 times table',  n:3,  ex:'3 × 7'},
  {id:'t4',  strand:'times', name:'4 times table',  n:4,  ex:'4 × 6'},
  {id:'t6',  strand:'times', name:'6 times table',  n:6,  ex:'6 × 8'},
  {id:'t7',  strand:'times', name:'7 times table',  n:7,  ex:'7 × 7'},
  {id:'t8',  strand:'times', name:'8 times table',  n:8,  ex:'8 × 4'},
  {id:'t9',  strand:'times', name:'9 times table',  n:9,  ex:'9 × 6'},
  {id:'d2510', strand:'div', name:'Dividing by 2, 5 and 10', by:[2,5,10], ex:'20 ÷ 5'},
  {id:'d34',   strand:'div', name:'Dividing by 3 and 4',     by:[3,4],    ex:'24 ÷ 3'},
  {id:'d67',   strand:'div', name:'Dividing by 6 and 7',     by:[6,7],    ex:'42 ÷ 7'},
  {id:'d89',   strand:'div', name:'Dividing by 8 and 9',     by:[8,9],    ex:'72 ÷ 9'},

  {id:'fsub', strand:'frac', name:'Taking away fractions', ex:'5/8 − 2/8'},

const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const SYM={'+':'+','-':'−','x':'×','/':'÷'};
const WORD={'+':'plus','-':'take away','x':'times','/':'divided by'};

/* Numbers of each kind. Decimals are kept as whole tenths (1.3 is 13) so the sums are exact.
   A fraction sum is answered as the top number over a bottom number that is given (q.d). */
const fmtDec=t=>t%10===0 ? String(t/10) : (t/10).toFixed(1);
const tenths=n=>n===1?'1 tenth':n+' tenths';
const FRN={2:['half','halves'],3:['third','thirds'],4:['quarter','quarters'],5:['fifth','fifths'],6:['sixth','sixths'],8:['eighth','eighths'],10:['tenth','tenths']};
const frSay=(n,d)=>n+' '+FRN[d][n===1?0:1];
const frHTML=(n,d)=>`<span class="fr"><b>${n}</b><span>${d}</span></span>`;
function valHTML(q,w){ if(q.kind==='frac'){ const f=w==='a'?q.fa:q.fb; return frHTML(f.n,f.d); } return q.kind==='dec'?fmtDec(q[w]):String(q[w]); }
const ansHTML=(q,v)=>q.kind==='frac'?frHTML(v,q.d) : q.kind==='dec'?fmtDec(v) : String(v);
const ansSay=(q,v)=>q.kind==='frac'?frSay(v,q.d) : q.kind==='dec'?fmtDec(v) : String(v);
const sumHTML=q=>valHTML(q,'a')+' '+SYM[q.op]+' '+valHTML(q,'b');
const sumSpeech=q=>q.kind==='frac' ? frSay(q.fa.n,q.fa.d)+' '+WORD[q.op]+' '+frSay(q.fb.n,q.fb.d)
  : (q.kind==='dec'?fmtDec(q.a):q.a)+' '+WORD[q.op]+' '+(q.kind==='dec'?fmtDec(q.b):q.b);
const sumKey=q=>q.kind==='frac' ? q.fa.n+'/'+q.fa.d+q.op+q.fb.n+'/'+q.fb.d : q.a+q.op+q.b;

/* Make one sum for a skill */
function makeSum(id){
  const s=SK[id]; let a,b,op;
  switch(id){
    case 'add10': op='+'; a=ri(1,9); b=ri(1,10-a); break;
    case 'add20': op='+';
      if(Math.random()<0.7){ do{ a=ri(3,9); b=ri(3,9); }while(a+b<=10); }
      else { a=ri(11,17); b=ri(1,20-a); }
      if(Math.random()<0.5) [a,b]=[b,a]; break;
    case 'addtens': op='+'; a=10*ri(1,8); b=10*ri(1,(100-a)/10); break;
    case 'add2d1d': op='+'; do{ a=ri(12,88); }while(a%10===0); b=ri(2,9); if(a+b>99) b=99-a; if(b<2){ a=45; b=ri(2,9); } break;
    case 'add2d2d': op='+'; a=ri(11,78); b=ri(11,99-a); if(b<11){ a=ri(11,40); b=ri(11,50); } break;
    case 'sub10': op='-'; a=ri(3,10); b=ri(1,a-1); break;
    case 'sub20': op='-'; a=ri(11,19); b=ri(2,9); break;
    case 'subtens': op='-'; a=10*ri(2,10); b=10*ri(1,a/10-1); break;
    case 'sub2d1d': op='-'; a=ri(21,99); b=ri(2,9); break;
    case 'sub2d2d': op='-'; a=ri(31,99); b=ri(11,a-10); break;
    case 'fadd': { const d=pick([3,4,5,6,8,10]); const x=ri(1,d-1), y=ri(1,d-x); return {skill:id,kind:'frac',op:'+',fa:{n:x,d},fb:{n:y,d},d,ans:x+y}; }
    case 'fsub': { const d=pick([3,4,5,6,8,10]); const x=ri(2,d), y=ri(1,x-1); return {skill:id,kind:'frac',op:'-',fa:{n:x,d},fb:{n:y,d},d,ans:x-y}; }
    case 'fhq': { /* halves and quarters, answered in quarters */
      const H={n:1,d:2}, Q=n=>({n,d:4});
      const all=[[H,'+',Q(1)],[Q(1),'+',H],[H,'+',Q(2)],[H,'+',H],[Q(3),'-',H],[H,'-',Q(1)],[Q(4),'-',H],[Q(2),'+',H]];
      const [fa,o,fb]=pick(all), qa=fa.n*4/fa.d, qb=fb.n*4/fb.d;
      return {skill:id,kind:'frac',op:o,fa,fb,d:4,ans:o==='+'?qa+qb:qa-qb}; }
    case 'dadd1': a=ri(1,8); b=ri(1,9-a); return {skill:id,kind:'dec',op:'+',a,b,ans:a+b};
    case 'dsub1': a=ri(2,9); b=ri(1,a-1); return {skill:id,kind:'dec',op:'-',a,b,ans:a-b};
    case 'dadd2': do{ a=ri(1,49); b=ri(1,49); }while(a%10===0||b%10===0||(a<10&&b<10&&a+b<10)); return {skill:id,kind:'dec',op:'+',a,b,ans:a+b};
    case 'dsub2': do{ a=ri(11,59); b=ri(1,a-1); }while(a%10===0||b%10===0); return {skill:id,kind:'dec',op:'-',a,b,ans:a-b};
    default:
      if(s.n){ op='x'; const k=ri(1,10); if(Math.random()<0.5){ a=s.n; b=k; } else { a=k; b=s.n; } }
      else if(s.by){ op='/'; b=pick(s.by); const q=ri(1,10); a=b*q; }
  }
  const ans = op==='+'?a+b : op==='-'?a-b : op==='x'?a*b : a/b;
  return {skill:id, kind:'int', a, op, b, ans};
}

/* Two wrong answers that look likely, for the big buttons. */
function wrongOnes(q){
  const A=q.ans; let c=[], ok;
  if(q.kind==='frac'){ c=[A+1,A-1,A+2,A-2]; ok=c.filter(x=>x>=0&&x<=q.d); }
  else if(q.kind==='dec'){ c=[A+1,A-1,A+10,A-10,A+2]; ok=c.filter(x=>x>0); }
  else if(q.op==='x'){ const n=SK[q.skill].n, k=q.a===n?q.b:q.a; ok=[n*(k+1), n*(k-1), A+1, A-1, (n+1)*k].filter(x=>x>=0); }
  else { c=[A+1,A-1,A+2,A-2]; if(A>=20) c.push(A+10,A-10); ok=c.filter(x=>x>=0); }
  ok=shuffle([...new Set(ok)].filter(x=>x!==A && Number.isInteger(x)));
  for(let x=0; ok.length<2; x++) if(x!==A && !ok.includes(x)) ok.push(x);
  return ok.slice(0,2);
}

/* =================== Voice ===================
   The device's own voices (speechSynthesis). Grown-ups can pick the nicest one. */
const canBrowser='speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let bVoice=null, browserSpeaking=false, appReady=false, view='who';
function voiceScore(v){
  const n=v.name||'';
  if(/compact|espeak|novelty|zarvox|bad news|bells|bubbles|cellos|trinoids|albert|fred|jester|organ|superstar|wobble|boing|junior|ralph|kathy|bahh|whisper|good news|hysterical|deranged|pipe/i.test(n)) return -100;
  let s=0;
  if(/natural|neural|online/i.test(n)) s+=60;
  if(/premium/i.test(n)) s+=55;
  if(/enhanced/i.test(n)) s+=45;
  if(/google/i.test(n)) s+=30;
  if(/karen|catherine|lee|daniel|serena|kate|moira|samantha|ava|zoe|allison|susan/i.test(n)) s+=10;
  s+=/en[-_]NZ/i.test(v.lang)?12:/en[-_]AU/i.test(v.lang)?10:/en[-_]GB/i.test(v.lang)?8:/en[-_](IE|ZA)/i.test(v.lang)?5:4;
  return s;
}
function deviceVoices(){ try{ return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a)); }catch(e){ return []; } }
function chooseBrowserVoice(){
  if(!canBrowser) return;
  const all=deviceVoices();
  bVoice=(state.deviceVoice && all.find(v=>v.name===state.deviceVoice)) || all[0] || null;
  if(appReady && (view==='grown' || view==='start')) render();
}
if(canBrowser){ chooseBrowserVoice(); try{ speechSynthesis.addEventListener('voiceschanged',chooseBrowserVoice); }catch(e){} }
const shortVoice=v=>v.name.replace(/^Microsoft |^Google /,'').replace(/ - .*$/,'');
function voiceNote(){
  if(!canBrowser) return 'This browser can’t read aloud. Try Chrome, Edge or Safari.';
  return 'Luna is using this device’s voice'+(bVoice?' ('+shortVoice(bVoice)+')':'')+'.';
}
let soundTrouble='', heardOnce=false;
function showTrouble(){ const el=$('#snd'); if(!el) return;
  const tx = !soundTrouble ? '' : canBrowser ? 'No sound? Check the phone isn’t on silent and the volume is up. If Luna still says nothing, open Grown-ups and tap a voice to try it.' : 'No sound? This browser can’t read aloud. Try Chrome, Edge or Safari.';
  el.textContent=tx; el.hidden=!tx; }
function browserSay(lines){
  if(!canBrowser){ soundTrouble='none'; showTrouble(); return Promise.resolve(); }
  return new Promise(res=>{
    let started=false;
    try{
      if(!bVoice) chooseBrowserVoice();
      /* cancel() right before speak() makes iPhones drop the new words, so only cancel when something is playing. */
      if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
      try{ speechSynthesis.resume(); }catch(e){}
      lines.forEach((tx,i)=>{ const u=new SpeechSynthesisUtterance(tx); if(bVoice){u.voice=bVoice;u.lang=bVoice.lang;} else u.lang='en-US';
        u.rate=0.9*state.rate/0.95; u.pitch=1.05;
        if(i===0) u.onstart=()=>{ started=true; heardOnce=true; if(soundTrouble){ soundTrouble=''; showTrouble(); } browserSpeaking=true; updateStop(); };
        if(i===lines.length-1) u.onend=u.onerror=()=>{ browserSpeaking=false; updateStop(); res(); };
        speechSynthesis.speak(u); });
    }catch(e){ res(); }
    setTimeout(()=>{ if(!started && !heardOnce && state.sound){ soundTrouble='silent'; showTrouble(); } }, 3000);
    setTimeout(res, 15000);
  });
}
/* A reading is a list of words to say and {pause:ms}. A newer say() or hush() ends the rest. */
let lastLines=[], sayToken=0;
async function say(items, opts){
  opts=opts||{};
  items=[].concat(items).filter(Boolean);
  if(!opts.noRemember) lastLines=items;
  if(!state.sound || !items.length) return;
  const my=++sayToken; let buf=[];
  const flush=async()=>{ if(!buf.length) return; const l=buf; buf=[]; await browserSay(l); };
  for(const it of items){
    if(my!==sayToken) return;
    if(typeof it==='string'){ buf.push(it); continue; }
    await flush(); if(my!==sayToken) return;
    if(it.pause) await wait(it.pause);
  }
  if(my===sayToken) await flush();
}
function hush(){ sayToken++; try{ canBrowser && speechSynthesis.cancel(); }catch(e){} browserSpeaking=false; updateStop(); }
function updateStop(){ const b=$('#stopBtn'); if(b) b.hidden=!browserSpeaking; }
/* written maths into words a voice reads well */
const speakify=t=>String(t).replace(/<[^>]+>/g,'').replace(/−/g,' take away ').replace(/×/g,' times ').replace(/÷/g,' divided by ')
  .replace(/→/g,', then ').replace(/(^|\s)\?(?=\s|$|[.,])/g,'$1what').replace(/=/g,' is ');

/* little sounds (no files needed) */
let actx=null;
function chime(kind){
  if(!state.sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const notes=kind==='good'?[660,880]:kind==='full'?[523,659,784,1047]:kind==='up'?[587,740,880]:kind==='tick'?[880]:[300,250];
    notes.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=f;
      const t=actx.currentTime+i*0.11; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.4); });
  }catch(e){}
}
document.addEventListener('pointerdown',()=>{ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} },{capture:true});

function toast(text, sound){
  let el=$('#toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
  if(text && text.html) el.innerHTML=text.html; else el.textContent=text;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  if(sound) chime(sound);
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2600);
}

/* =================== Show me how ===================
   A picture and short steps for one sum. With show=false (the ❓ button, before answering) the final answer is a "?". */
function dotsHTML(groups, size){
  const all=[]; groups.forEach(g=>{ for(let i=0;i<g.n;i++) all.push(g.cls||''); });
  const rows=[]; for(let i=0;i<all.length;i+=5){ const r=all.slice(i,i+5); rows.push('<div class="drow">'+r.map(c=>`<span class="d ${c}"></span>`).join('')+'</div>'); }
  return `<div class="dots" style="--ds:${size||18}px">${rows.join('')}</div>`;
}
function arrayHTML(rowsN, colsN){
  const size = colsN*rowsN>50 ? 10 : colsN>8||rowsN>8 ? 12 : 16;
  return `<div class="dots" style="--ds:${size}px;gap:${size<12?3:5}px">${Array.from({length:rowsN},()=>'<div class="drow">'+Array.from({length:colsN},()=>'<span class="d"></span>').join('')+'</div>').join('')}</div>`;
}
function countHTML(step, to, show){ const c=[]; for(let v=step; v<=to; v+=step) c.push(`<span class="${v===to?'end':''}">${(v===to&&!show)?'?':v}</span>`); return `<div class="count">${c.join('')}</div>`; }
function barHTML(d, cls){ return `<div class="fbar">${Array.from({length:d},(_,i)=>`<i class="${cls[i]||''}"></i>`).join('')}</div>`; }
const fill=(n,c)=>Array(Math.max(0,n)).fill(c);
function method(q, show){
  const M=v=>show?v:'?', ans=q.ans, L=[]; let pic='';
  if(q.kind==='frac'){
    const {fa,fb,d,op}=q, sign=op==='+'?'+':'−';
    if(q.skill==='fhq'){
      const qa=fa.n*4/fa.d, qb=fb.n*4/fb.d;
      pic=`<div class="fbars">${barHTML(2,['a'])}${barHTML(4,['a','a'])}</div>`;
      L.push('One half is the same as two quarters.');
      L.push(`So ${frSay(fa.n,fa.d)} ${WORD[op]} ${frSay(fb.n,fb.d)} is the same as ${frSay(qa,4)} ${WORD[op]} ${frSay(qb,4)}.`);
      L.push(`${qa} ${sign} ${qb} = ${M(ans)}, so it’s ${show?frSay(ans,4):'? quarters'}.`);
      if(show && ans===4) L.push('4 quarters make one whole!');
    } else {
      pic = op==='+' ? barHTML(d, fill(fa.n,'a').concat(fill(fb.n,'b'))) : barHTML(d, fill(fa.n-fb.n,'a').concat(fill(fb.n,'x')));
      L.push(`The whole is cut into ${d} equal pieces, called ${FRN[d][1]}.`);
      L.push(op==='+' ? `${frSay(fa.n,d)} + ${frSay(fb.n,d)} = ${show?frSay(ans,d):'? '+FRN[d][1]}.` : `Start with ${frSay(fa.n,d)}. Take away ${fb.n}. So ${show?frSay(ans,d):'? '+FRN[d][1]} are left.`);
      L.push(`The pieces stay the same size, so the bottom number stays ${d}.`);
      if(show && ans===d) L.push(`${d} ${FRN[d][1]} make one whole!`);
    }
  } else if(q.kind==='dec'){
    const {a,b,op}=q, sign=op==='+'?'+':'−';
    if(a<=10 && (op==='-' || a+b<=10)) pic = op==='+' ? barHTML(10, fill(a,'a').concat(fill(b,'b'))) : barHTML(10, fill(a-b,'a').concat(fill(b,'x')));
    L.push(`Think in tenths: ${fmtDec(a)} is ${tenths(a)} and ${fmtDec(b)} is ${tenths(b)}.`);
    L.push(`${a} ${sign} ${b} = ${M(ans)} tenths.`);
    if(show) L.push(ans>=10 && ans%10 ? `10 tenths make 1 whole, so ${ans} tenths is ${Math.floor(ans/10)} and ${tenths(ans%10)}: ${fmtDec(ans)}.` : ans%10===0 ? `${ans} tenths is ${ans/10} whole${ans===10?'':'s'}: ${fmtDec(ans)}.` : `${tenths(ans)} is ${fmtDec(ans)}.`);
    else L.push(ans>=10 ? '10 tenths make 1 whole. Then put the dot back in.' : 'Then write it with the dot: tenths go after the dot.');
  } else {
    const {a,b,op}=q;
    if(op==='+'){
      if(a<=10 && b<=10){ pic=`<div class="dgroups">${dotsHTML([{n:a}])}<span>+</span>${dotsHTML([{n:b,cls:'b'}])}</div>`; L.push(`${a} and ${b} more makes ${M(ans)}.`); }
      else if(a%10===0 && b%10===0) L.push(`${a/10} tens + ${b/10} tens = ${M(ans/10)} tens.`);
      else { const big=Math.max(a,b), small=Math.min(a,b);
        if(small<10){ const ones=big%10, toTen=10-ones;
          if(ones+small<10){ L.push(`Add the ones: ${ones} + ${small} = ${ones+small}.`); L.push(`The tens stay the same, so ${big} + ${small} = ${M(ans)}.`); }
          else if(small===toTen) L.push(`${big} needs ${toTen} more to make the next ten, so ${big} + ${small} = ${M(ans)}.`);
          else L.push(`${big} + ${toTen} = ${big+toTen}, then ${small-toTen} more makes ${M(ans)}.`); }
        else { const ta=Math.floor(a/10)*10, tb=Math.floor(b/10)*10, t=ta+tb, o=a%10+b%10;
          L.push(`Tens: ${ta} + ${tb} = ${t}.`); L.push(`Ones: ${a%10} + ${b%10} = ${o}.`); L.push(`${t} + ${o} = ${M(ans)}.`); } }
    } else if(op==='-'){
      if(a<=20){ pic=dotsHTML([{n:ans},{n:b,cls:'x'}]); L.push(`Start with ${a}, take away ${b}. ${M(ans)} are left.`); }
      else if(a%10===0 && b%10===0) L.push(`${a/10} tens − ${b/10} tens = ${M(ans/10)} tens.`);
      else if(b<10){ const ones=a%10;
        if(b<=ones){ L.push(`Take the ones: ${ones} − ${b} = ${ones-b}.`); L.push(`The tens stay the same, so ${a} − ${b} = ${M(ans)}.`); }
        else L.push(`${a} − ${ones} = ${a-ones}, then take away ${b-ones} more: ${M(ans)}.`); }
      else { const tens=Math.floor(b/10)*10, mid=a-tens; L.push(`Take the tens: ${a} − ${tens} = ${mid}.`); L.push(`Then the ones: ${mid} − ${b%10} = ${M(ans)}.`); }
    } else if(op==='x'){ const n=SK[q.skill].n, k=a===n?b:a;
      pic=arrayHTML(k,n); L.push(`${k} lot${k===1?'':'s'} of ${n}. Count in ${n}s, ${k} times:`); pic+=countHTML(n,ans,show);
    } else {
      L.push(`How many ${b}s make ${a}? Count in ${b}s until you get to ${a}:`); pic=countHTML(b,a,true);
      L.push(show?`That’s ${ans} jump${ans===1?'':'s'}, so ${ans} lots of ${b}.`:'Count the jumps. That’s the answer!');
      if(show) pic+=arrayHTML(ans,b);

  return {pic, lines:L, eq:`<div class="eq">${sumHTML(q)} = ${show?ansHTML(q,ans):'?'}</div>`};
}
function methodHTML(q, show, title){
  const m=method(q,show);
  return `<div class="help${show?'':' teach'}">${title?`<h3>${title}</h3>`:''}${m.pic}<div class="lines">${m.lines.map(l=>`<p>${esc(l)}</p>`).join('')}</div>${m.eq}</div>`;
}

/* =================== Tips and tricks ===================
   Extra ways of thinking about a sum, plus where it turns up in real life. Optional. */
function tipsFor(q, show){
  const s=SK[q.skill], T=[], M=v=>show?v:'?', ans=q.ans, {a,b,op}=q;
  if(s.strand==='add'){
    if(q.skill==='add10') T.push('Learn the friends of 10: 1 + 9, 2 + 8, 3 + 7, 4 + 6 and 5 + 5. They help with lots of bigger sums.');
    if(a===b && a<=10) T.push(`Doubles are easy to remember: ${a} + ${a} = ${M(ans)}.`);
    else if(Math.abs(a-b)===1 && a<=10 && b<=10){ const lo=Math.min(a,b); T.push(`Near doubles: ${lo} + ${lo} = ${2*lo}, so ${a} + ${b} is just one more.`); }
    if(q.skill==='add20' && a<=10 && b<=10){ const big=Math.max(a,b), small=Math.min(a,b), need=10-big; if(need>0 && small>need) T.push(`Make a ten: ${big} + ${need} = 10. Then add the ${small-need} left over.`); }
    const nine=[a,b].find(x=>x%10===9 && x<100);
    if(nine && q.skill!=='addtens') T.push(`Adding ${nine}? Add ${nine+1} instead, then take 1 away.`);
    if(q.skill==='addtens') T.push(`Tens work just like ones: ${a/10} + ${b/10} = ${M(ans/10)}, so ${a/10} tens + ${b/10} tens = ${M(ans/10)} tens.`);
    if(q.skill==='add2d1d') T.push('Only the ones change, unless they go past 10. Then the tens go up by one.');
    if(q.skill==='add2d2d'){ T.push('Split both numbers into tens and ones. Add the tens, add the ones, then put them together.');
      const near=[a,b].find(x=>x%10>=8); if(near){ const up=Math.ceil(near/10)*10, other=near===a?b:a; T.push(`Round and fix: ${near} is close to ${up}. Do ${other} + ${up}, then take ${up-near} away.`); } }
    if(a!==b) T.push(`Turnaround: ${a} + ${b} is the same as ${b} + ${a}. Start with the bigger number and count on.`);
  }
  else if(s.strand==='sub'){
    T.push(`Think of the adding fact: ${b} + ? = ${a}. What do you add to ${b} to make ${a}?`);
    if(q.skill==='subtens') T.push(`Tens work just like ones: ${a/10} − ${b/10} = ${M(ans/10)}, so it’s ${M(ans/10)} tens.`);
    else if(b<10 && a>10 && b>a%10) T.push(`Jump back to the ten first: ${a} − ${a%10} = ${a-a%10}. Then take away the other ${b-a%10}.`);
    if(q.skill==='sub2d2d'){ const up=Math.ceil(b/10)*10;
      T.push(up>b ? `Count up, like a shopkeeper giving change: from ${b} to ${up} is ${up-b}, then from ${up} to ${a} is ${M(a-up)}. Add the two jumps.` : `Count up from ${b} to ${a} in tens, then ones.`); }
    if(b%10===9) T.push(`Taking away ${b}? Take away ${b+1}, then add 1 back.`);
    if(a-b<=4 && a>5) T.push(`${a} and ${b} are close together, so count up from ${b} to ${a}.`);
    else if(b<=3) T.push(`Taking away a small number? Just count back ${b} from ${a}.`);
  }
  else if(s.strand==='times'){
    const n=s.n, k=a===n?b:a;
    const t={2:[`Times 2 is doubling. Double ${k} is ${M(2*k)}.`],
      5:['The 5 times table always ends in 5 or 0.', `Times 5 is half of times 10: ${k} × 10 = ${10*k}, and half of that is ${M(5*k)}.`],
      10:[`Times 10: every digit moves one place bigger and a 0 fills the ones. ${k} becomes ${M(10*k)}.`],
      3:[`Times 3 is double, plus one more lot: ${2*k} + ${k} = ${M(3*k)}.`],
      4:[`Times 4 is double, then double again: ${k} → ${2*k} → ${M(4*k)}.`],
      6:[`Times 6 is times 5, plus one more lot: ${5*k} + ${k} = ${M(6*k)}.`],
      7:[`Times 7 is times 5 plus times 2: ${5*k} + ${2*k} = ${M(7*k)}.`],
      8:[`Times 8: double three times. ${k} → ${2*k} → ${4*k} → ${M(8*k)}.`],
      9:[`Times 9 is times 10, take away one lot: ${10*k} − ${k} = ${M(9*k)}.`, `Finger trick: hold up 10 fingers and fold down finger number ${k}. The fingers before it are the tens and the fingers after it are the ones.`, 'In the 9 times table the digits add up to 9: 18, 27, 36, 45…']}[n]||[];
    T.push(...t);
    if(a!==b) T.push(`Turnaround: ${a} × ${b} is the same as ${b} × ${a}. Use the table you know better.`);
  }
  else if(s.strand==='div'){
    T.push(`Dividing is a times table backwards: ${b} × ? = ${a}.`);
    if(b===2) T.push(`Dividing by 2 is halving. Half of ${a} is ${M(ans)}.`);
    if(b===10) T.push('Dividing by 10: take the 0 off the end.');
    if(b===5) T.push(`Dividing by 5: double it, then divide by 10. ${a} doubled is ${2*a}.`);
    T.push(`Dividing can mean sharing ${a} equally into ${b} groups, or finding how many ${b}s fit into ${a}. Both give the same answer.`);
  }
  else if(s.strand==='frac'){
    T.push('The bottom number says how many equal pieces the whole is cut into. The top number says how many pieces you have.');
    if(q.skill==='fhq'){ T.push('One half is the same as two quarters: cut each half in two.'); T.push('Change the halves into quarters first. Then all the pieces are the same size and you can add or take away the top numbers.'); }
    else T.push(`The bottom numbers are the same, so the pieces are the same size. Just ${op==='+'?'add':'take away'} the top numbers. The bottom number stays ${q.d}!`);
    T.push('When the top and bottom numbers are the same, like 4/4, you have all the pieces: one whole.');
  }
  else if(s.strand==='dec'){
    T.push(a<10 ? `The digit after the dot is tenths. ${fmtDec(a)} means ${tenths(a)}, like ${a} slice${a===1?'':'s'} of a cake cut into 10.` : `${fmtDec(a)} means ${Math.floor(a/10)} whole and ${tenths(a%10)}.`);
    T.push('Add or take away the tenths just like ones, then put the dot back.');
    if(op==='+' && (a%10+b%10)>=10) T.push('10 tenths make 1 whole. If the tenths go past 9, carry 1 over to the wholes.');
    if(op==='-' && b%10>a%10) T.push('Not enough tenths? Swap 1 whole for 10 tenths, then take away.');
    if(a>=10 || b>=10) T.push('Line up the dots: wholes under wholes, tenths under tenths.');
  }
  return {tricks:T.slice(0,4), life:lifeFor(q)};
}
/* a real-life sum, picked the same way each time for the same sum */
function lifeFor(q){
  let h=7; for(const c of sumKey(q)) h=(h*31+c.charCodeAt(0))>>>0;
  const P=arr=>arr[h%arr.length], {a,b,op}=q;
  if(q.kind==='frac'){ const d=q.d, A=frSay(q.fa.n,q.fa.d), B=frSay(q.fb.n,q.fb.d);
    if(q.skill==='fhq') return op==='+' ? `You eat ${A} of a sandwich, then ${B} of another sandwich. How much sandwich did you eat?` : `You have ${A} of a cake. You give ${B} of a cake to a friend. How much cake is left?`;
    return op==='+' ? P([`A pizza is cut into ${d} equal slices. You eat ${q.fa.n} and your friend eats ${q.fb.n}. What part of the pizza is gone?`, `A chocolate bar has ${d} equal pieces. You eat ${A} today and ${B} tomorrow. How much have you eaten?`])
      : P([`${cap(A)} of a pie is left. You eat ${B}. How much pie is left now?`, `You paint ${A} of a fence, then rain washes off ${B}. How much is still painted?`]); }
  if(q.kind==='dec'){ const A=fmtDec(a), B=fmtDec(b);
    return op==='+' ? P([`A ribbon is ${A} metres long. You tie on ${B} metres more. How long is it now?`, `You walk ${A} km to the park, then ${B} km to the shop. How far did you walk?`, `A plant was ${A} m tall and grew ${B} m. How tall is it now?`])
      : P([`A jug holds ${A} litres of water. You pour out ${B} litres. How much is left?`, `A rope is ${A} m long. You cut off ${B} m. How long is it now?`]); }
  if(op==='+') return P([`Luna found ${a} pine cones, then ${b} more. How many pine cones does she have?`, `There are ${a} wolves in one pack and ${b} in another. How many wolves altogether?`, `You have $${a} and you earn $${b} more. How much money now?`]);
  if(op==='-') return P([`There were ${a} stars in the sky. ${b} hid behind a cloud. How many are still shining?`, `You have $${a} and spend $${b}. How much is left?`, `A book has ${a} pages. You have read ${b}. How many pages to go?`]);
  if(op==='x'){ const n=SK[q.skill].n, k=a===n?b:a;
    if(n===7) return `There are 7 days in a week. How many days are in ${k} week${k===1?'':'s'}? That’s ${k} × 7.`;
    return P([`${k} wolf cubs each find ${n} berries. How many berries altogether?`, `${k} packs with ${n} pencils in each. How many pencils?`, `${k} rows of chairs with ${n} chairs in each row. How many chairs?`]); }
  return P([`${a} berries are shared equally between ${b} wolf cubs. How many does each cub get?`, `${a} cupcakes go into boxes of ${b}. How many boxes do you need?`]);
}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* =================== A round ===================
   One sum at a time. The kinds take turns. A missed sum comes back 3 sums later.
   Every answer is timed quietly (shown only on the Grown-ups page and in speed practice).
   ❓ Show me how and 💡 Tips teach the sum: a right answer after that gives no moon step (and no step back),
   and the sum comes back later to try alone. "I know it all" banks the skill as a full moon without using up the round. */
let sess=null, cur=null, timers=[];
const later=(fn,ms)=>{ const t=setTimeout(fn,ms); timers.push(t); return t; };
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
const PRAISE=['That’s right!','Well done!','Yes!','You got it!','Great work!','Spot on!'];
const SPEED_N=8;

function newRound(only){
  sess={limit:state.perRound, done:0, right:0, skipped:0, only:only||null, retry:[], recent:[], start:{}, speed:false};
  SKILLS.forEach(s=>sess.start[s.id]=phaseOf(s.id));
}
function kindsOn(){ const k=STRANDS.filter(s=>state.kinds[s.id]).map(s=>s.id); return k.length?k:STRANDS.map(s=>s.id); }
function chooseSkill(){
  if(sess.only) return sess.only;
  const ks=kindsOn();
  state.turn=(state.turn||0)%ks.length; const k=ks[state.turn]; state.turn=(state.turn+1)%ks.length;
  const n=nextOf(k);
  return n ? n.id : pick(SKILLS.filter(s=>s.strand===k)).id;   /* every skill of this kind is full: practise any of them */
}
function nextSum(){
  if(sess.retry.length && sess.retry[0].at<=sess.done) return Object.assign({}, sess.retry.shift().q, {again:true});
  const id=chooseSkill(); let q, n=0;
  do{ q=makeSum(id); n++; }while(sess.recent.includes(sumKey(q)) && n<12);
  return q;
}
function begin(only){
  hush(); clearTimers(); newRound(only);
  const first=only?['Let’s practise '+SK[only].name.toLowerCase()+'!',{pause:500}]:['Hi! Let’s fill some moons.',{pause:500}];
  ask(nextSum(), first);
}
function beginSpeed(id){
  hush(); clearTimers(); newRound(id); sess.speed=true; sess.limit=SPEED_N; sess.times=[];
  say(['Speed practice! Ready, go!'],{noRemember:true});
  ask(nextSum());
}
function ask(q, prefix){
  clearTimers();
  sess.recent.push(sumKey(q)); if(sess.recent.length>8) sess.recent.shift();
  cur={q, mode:(sess.speed || ptsOf(q.skill)>=STEP)?'pad':'buttons', typed:'', answered:false, options:null, helped:false, timeBad:false, teach:false, tipsOpen:false};
  if(cur.mode==='buttons') cur.options=shuffle([q.ans].concat(wrongOnes(q)));
  view='sum'; render();
  cur.t0=performance.now();
  if(!sess.speed) say((prefix||[]).concat([(q.again?'Try this one again. ':'')+'What is '+sumSpeech(q)+'?']));
}
function nextOne(){
  hush(); clearTimers();
  if(!sess) return;
  if(sess.speed) return advanceSpeed();
  if(sess.done>=sess.limit) return finishRound();
  ask(nextSum());
}
function pushRetry(q){ const c=JSON.parse(JSON.stringify(q)); delete c.again; sess.retry.push({q:c, at:sess.done+3}); }
function answer(val){
  if(!cur || cur.answered || val==null || Number.isNaN(val)) return;
  const q=cur.q, ok=(val===q.ans), ms=performance.now()-cur.t0, timeOk=!cur.helped && !cur.timeBad;
  cur.answered=true; cur.given=val; cur.ok=ok; cur.teach=false; cur.tipsOpen=false;
  if(sess.speed) return answerSpeed(ok, ms, timeOk);
  const r=rec(q.skill), before=phaseOf(q.skill);
  r.last=Date.now();
  if(ok){ sess.right++;
    if(cur.helped){ r.helped=(r.helped||0)+1; pushRetry(q); }
    else { r.right++; r.pts=Math.min(FULL, r.pts+1); if(timeOk) r.times=(r.times||[]).concat(Math.round(ms)).slice(-20); } }
  else { r.wrong++; if(!cur.helped){ const floor=Math.min(FULL, before*STEP); r.pts=Math.max(floor, r.pts-1); } pushRetry(q); }
  const d=state.days[today()]||(state.days[today()]={n:0,right:0}); d.n++; if(ok) d.right++;
  sess.done++;
  const after=phaseOf(q.skill);
  cur.moved = after>before ? after : 0;
  const line = cur.helped ? 'That’s right! Now you know how.' : pick(PRAISE);
  cur.praise=line;
  save(); render();
  if(ok){
    chime('good');
    if(cur.moved){ later(()=>toast(moonToast(q.skill, after), after===3?'full':'up'), 350); }
    say([line, cur.moved===3?'Full moon! You know '+SK[q.skill].name.toLowerCase()+'!':''].filter(Boolean),{noRemember:true});
    later(nextOne, cur.moved?2600:cur.helped?2400:1300);
  } else {
    chime('try');
    say(['Good try. '+sumSpeech(q)+' is '+ansSay(q,q.ans)+'.'],{noRemember:true});
  }
}
function moonToast(id, ph){ return {html: moon(ph)+' '+PHASE_NAME[ph]+': '+esc(SK[id].name)+'!'}; }
function knowAll(){
  if(!cur) return; const id=cur.q.skill, r=rec(id);
  r.pts=FULL; r.trusted=1; r.last=Date.now(); save();
  toast('⭐ '+SK[id].name+': full moon!','full');
  hush(); clearTimers();
  if(sess.only){ sess.only=null; }      /* that skill is done: carry on with the usual mix */
  later(()=>ask(nextSum()), 600);
}
function skipSum(){ if(!cur||cur.answered) return; sess.done++; sess.skipped++; nextOne(); }
function finishRound(){
  clearTimers(); hush(); view='end'; render();
  say(['Done for today! Great work!'],{noRemember:true});
}
function showHow(){
  if(!cur||cur.answered) return;
  cur.teach=!cur.teach; if(cur.teach){ cur.helped=true; }
  render();
  if(cur.teach){ const m=method(cur.q,false); say(['Here’s how.'].concat(m.lines.map(speakify), ['Now you try!'])); }
  else hush();
}
function openTips(){
  if(!cur) return;
  if(!cur.answered) cur.helped=true;
  cur.tipsOpen=true; render();
  const t=tipsFor(cur.q, cur.answered);
  say(['Tips and tricks.'].concat(t.tricks.map(speakify), [{pause:400}, 'In real life: '+speakify(t.life)]),{noRemember:true});
}
function closeTips(){ if(!cur) return; cur.tipsOpen=false; hush(); render(); }

/* =================== Speed practice (full moons only) ===================
   8 sums from one full-moon skill. Timed quietly; the average comes at the end.
   Every run earns at least one badge, always measured against her own earlier runs, never a set time. */
const BADGES={
  first:{e:'🌟',n:'First speed run'},
  pb:{e:'🏆',n:'New personal best!'},
  quicker:{e:'📈',n:'Quicker than last time'},
  lightning:{e:'⚡',n:'Quickest sum ever'},
  perfect:{e:'✅',n:'8 out of 8'},
  steady:{e:'🐾',n:'Steady paws: close to your best'},
  kept:{e:'💪',n:'Kept going'},
  runs5:{e:'🔥',n:'5 speed runs'}, runs10:{e:'🌙',n:'10 speed runs'}, runs25:{e:'🐺',n:'25 speed runs'}, runs50:{e:'👑',n:'50 speed runs'}
};
function answerSpeed(ok, ms, timeOk){
  sess.done++;
  if(ok){ sess.right++; if(timeOk) sess.times.push(Math.round(ms)); chime('tick'); } else chime('try');
  render();
  later(advanceSpeed, ok?450:1600);
}
function advanceSpeed(){ clearTimers(); if(sess.done>=sess.limit) finishSpeed(); else ask(nextSum()); }
function finishSpeed(){
  clearTimers(); hush();
  const id=sess.only, r=rec(id), sp=r.speed||(r.speed={runs:[],best:null,fastest:null,badges:{}});
  const times=sess.times||[], avg=times.length?times.reduce((x,y)=>x+y,0)/times.length:null, fastest=times.length?Math.min(...times):null;
  const prev=sp.runs, last=prev[prev.length-1], earned=[], counts=avg!=null && sess.right>=Math.ceil(sess.limit*0.75);
  if(!prev.length) earned.push('first');
  if(counts){ if(sp.best==null) sp.best=Math.round(avg); else if(avg<sp.best){ earned.push('pb'); sp.best=Math.round(avg); } }
  if(avg!=null && last && last.avg!=null && avg<last.avg && !earned.includes('pb')) earned.push('quicker');
  if(fastest!=null){ if(sp.fastest!=null && fastest<sp.fastest) earned.push('lightning'); if(sp.fastest==null || fastest<sp.fastest) sp.fastest=fastest; }
  if(sess.done>=sess.limit && sess.right===sess.limit) earned.push('perfect');
  const n=prev.length+1; if([5,10,25,50].includes(n)) earned.push('runs'+n);
  if(!earned.length) earned.push(counts && sp.best!=null && avg<=sp.best*1.1 ? 'steady' : 'kept');
  prev.push({at:Date.now(), avg:avg==null?null:Math.round(avg), right:sess.right, n:sess.done}); if(prev.length>60) prev.shift();
  earned.forEach(b=>sp.badges[b]=(sp.badges[b]||0)+1);
  sess.result={id, avg, best:sp.best, earned, right:sess.right, n:sess.done, recent:prev.slice(-5).map(x=>x.avg)};
  save(); view='speedEnd'; render();
  say([earned.includes('pb')?'A new personal best!':'Well done!', avg!=null?'Your average was '+secs(avg)+' seconds.':'', 'You earned: '+earned.map(b=>BADGES[b].n.replace(/[:!].*$/,'')).join(', ')+'.'].filter(Boolean),{noRemember:true});
}
function renderSpeedEnd(){
  const R=sess.result, s=SK[R.id];
  stage.innerHTML=`<section class="hero" style="gap:14px">
    ${wolfHero('min(130px,34vw)')}
    <h1>⚡ Speed practice done!</h1>
    <p class="sub">${esc(s.name)}: ${R.right} of ${R.n} right</p>
    ${R.avg!=null?`<div class="stat">${secs(R.avg)} seconds</div><p class="sub">your average for a right answer${R.best!=null?` · your best: ${secs(R.best)} s`:''}</p>`:'<p class="sub">No right answers this time. Have another go!</p>'}
    ${R.recent.filter(x=>x!=null).length>1?`<div class="recent" aria-label="Your last runs">${R.recent.map((x,i)=>x==null?'':`<span class="${i===R.recent.length-1?'now':''}">${secs(x)}</span>`).join('')}</div>`:''}
    <div class="badges">${R.earned.map(b=>`<div class="badge pop"><span>${BADGES[b].e}</span><b>${esc(BADGES[b].n)}</b></div>`).join('')}</div>
    <div class="row center"><button class="speedbtn" id="sAgain" type="button">⚡ Go again</button></div>
    <div class="row center"><button class="soft" id="mm" type="button">🌙 My moons</button><button class="soft" id="home" type="button">Finish</button></div>
  </section>`;
  $('#sAgain').onclick=()=>beginSpeed(R.id);
  $('#mm').onclick=()=>{ sess=null; openMoons('start'); };
  $('#home').onclick=()=>{ hush(); sess=null; view='start'; render(); };
}

function renderSum(){
  const q=cur.q, s=SK[q.skill], st=STRANDS.find(x=>x.id===s.strand), ph=phaseOf(q.skill), speed=!!sess.speed;
  const blankAns = q.kind==='frac' ? frHTML('<span class="q">?</span>', q.d) : '<span class="q">?</span>';
  const shown = `${sumHTML(q)} = ${cur.answered ? ansHTML(q,q.ans) : blankAns}`;
  let answerHTML='';
  if(cur.mode==='buttons'){
    answerHTML=`<div class="choices">${cur.options.map(v=>{
      let cls=''; if(cur.answered){ if(v===q.ans) cls=' right'; else if(v===cur.given) cls=' wrong'; else cls=' fade'; }
      return `<button class="choice${cls}" type="button" data-v="${v}" ${cur.answered?'disabled':''}>${ansHTML(q,v)}</button>`; }).join('')}</div>`;
  } else {
    answerHTML=`<div class="ansbox${cur.answered?(cur.ok?' right':' wrong'):''}" id="ansbox">${boxHTML()}</div>`;
    if(!cur.answered){
      const last = q.kind==='dec'
        ? `<button class="key alt" type="button" data-k=".">.</button><button class="key" type="button" data-k="0">0</button><button class="key alt" type="button" data-k="back" aria-label="Delete">⌫</button><button class="key go wide3" type="button" data-k="ok" aria-label="Check" ${cur.typed?'':'disabled'}>✓</button>`
        : `<button class="key alt" type="button" data-k="back" aria-label="Delete">⌫</button><button class="key" type="button" data-k="0">0</button><button class="key go" type="button" data-k="ok" aria-label="Check" ${cur.typed?'':'disabled'}>✓</button>`;
      answerHTML+=`<div class="pad">${['1','2','3','4','5','6','7','8','9'].map(k=>`<button class="key" type="button" data-k="${k}">${k}</button>`).join('')}${last}</div>`;
    }
  }
  let fb='';
  if(cur.answered && speed){
    fb=cur.ok?'<div class="fb"><div class="say good">✓</div></div>':`<div class="fb"><div class="say try">It’s ${ansHTML(q,q.ans)}.</div></div>`;
  } else if(cur.answered && cur.ok){
    fb=`<div class="fb pop"><div class="say good">${esc(cur.praise||'That’s right!')}</div>${cur.helped?'<p class="hint" style="color:var(--muted);font-size:15px">It comes back soon, to try on your own.</p>':''}${cur.moved?`<div class="move">${moon(cur.moved)} <b>${PHASE_NAME[cur.moved]}</b>: ${esc(s.name)}</div>`:''}</div>`;
  } else if(cur.answered){
    fb=`<div class="fb pop"><div class="say try">Good try! It’s ${ansHTML(q,q.ans)}.</div>${methodHTML(q,true)}
      <div class="tools"><button class="toolbtn tip" id="tipBtn" type="button">💡 Tips and tricks</button></div>
      <p class="hint" style="color:var(--muted);font-size:15px">This one comes back soon.</p><button class="big" id="nextBtn" type="button">Next ▶</button></div>`;
  }
  const head = speed
    ? `<div class="qhead"><div class="skilltag">${moon(3)}<span>⚡ Speed practice · ${esc(s.name)}</span></div></div>`
    : `<div class="qhead"><div class="skilltag">${moon(ph)}<span>${st.emoji} ${esc(s.name)}</span>${pipsHTML(q.skill)}</div>
      ${cur.answered||ph>=3?'':`<button class="knowall" id="knowAll" type="button">⭐ I know it all</button>`}</div>`;
  const tools = (!speed && !cur.answered) ? `<div class="tools">
      <button class="toolbtn" id="howBtn" type="button" aria-pressed="${cur.teach}">❓ ${cur.teach?'Hide help':'Show me how'}</button>
      <button class="toolbtn tip" id="tipBtn" type="button">💡 Tips</button>
      <button class="skipbtn" id="skipBtn" type="button">Skip ⏭</button></div>` : '';
  stage.innerHTML=`<section class="stage">
    ${head}
    ${q.again&&!speed?'<span class="again-tag">Try again</span>':''}
    <div class="sum${cur.answered?(cur.ok?' right':' wrong'):''}" id="sumBox">${shown}</div>
    ${cur.teach && !cur.answered ? methodHTML(q,false,'Here’s how')+'<p class="hint" style="color:var(--muted)">Now you try!</p>' : ''}
    ${answerHTML}
    ${fb}
    ${tools}
  </section>
  ${cur.tipsOpen?tipsPopHTML():''}`;
  stage.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>answer(+b.dataset.v));
  stage.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>typeKey(b.dataset.k));
  const on=(sel,fn)=>{ const el=$(sel); if(el) el.onclick=fn; };
  on('#knowAll',knowAll); on('#skipBtn',skipSum); on('#nextBtn',nextOne); on('#howBtn',showHow); on('#tipBtn',openTips);
  if(cur.tipsOpen){ on('#tipClose',closeTips); $('#wpop').onclick=ev=>{ if(ev.target.id==='wpop') closeTips(); }; }
  requestAnimationFrame(fitSum);
}
function tipsPopHTML(){
  const t=tipsFor(cur.q, cur.answered);
  return `<div class="wpop" id="wpop"><div class="popcard tipcard pop" role="dialog" aria-label="Tips and tricks">
    <h2>💡 Tips and tricks</h2>

  </div></div>`;

function boxHTML(){
  const q=cur.q;
  if(cur.answered) return cur.ok ? ansHTML(q,q.ans) : `<s style="color:var(--no)">${ansHTML(q,cur.given)}</s>`;
  const t = cur.typed || '<span class="ph">?</span>';
  return q.kind==='frac' ? frHTML(t, q.d) : t;
}
function typeKey(k){
  if(!cur || cur.answered || cur.mode!=='pad') return;
  const q=cur.q;
  if(k==='ok'){ if(!cur.typed) return; const v = q.kind==='dec' ? Math.round(parseFloat(cur.typed)*10) : parseInt(cur.typed,10); if(!Number.isNaN(v)) answer(v); return; }
  if(k==='back') cur.typed=cur.typed.slice(0,-1);
  else if(k==='.'){ if(q.kind!=='dec' || cur.typed.includes('.')) return; cur.typed=(cur.typed||'0')+'.'; }
  else { const max = q.kind==='frac'?2 : q.kind==='dec'?5 : 3; if(cur.typed.replace('.','').length>=max) return;
    if(q.kind==='dec' && /\.\d$/.test(cur.typed)) return;            /* one place after the dot */
    cur.typed=(cur.typed==='0'?'':cur.typed)+k; }
  const box=$('#ansbox'); if(box) box.innerHTML=boxHTML();
  const go=stage.querySelector('[data-k="ok"]'); if(go) go.disabled=!cur.typed;
}

      restoreArmed={code, msg: same.length?'Tap again: replaces progress for '+same.join(', '):'Tap again to add '+d.players.map(p=>p.name).join(', ')}; render(); return; }
    restoreArmed=null; const n=loadBackup(d); render(); $('#bkMsg').textContent='Loaded '+n+' name'+(n===1?'':'s')+'.'; };
  stage.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ const id=b.dataset.rm; if(whoArmed!==id){ whoArmed=id; render(); return; } whoArmed=null; removePlayer(id); if(!who){ afterGrown=null; view='who'; } render(); });
  $('#reset').onclick=()=>{ if(!resetArmed){ resetArmed=true; render(); return; }
    const keep={rate:state.rate,sound:state.sound,perRound:state.perRound,deviceVoice:state.deviceVoice,kinds:state.kinds};
    state=Object.assign(blank(),keep); resetArmed=false; cur=null; sess=null; afterGrown=null; save(); render(); };
  $('#back').onclick=closeGrown;
}
/* How to get a nicer voice on each kind of device. */
function betterVoiceTips(){
  const ua=navigator.userAgent||'';
  const android=/Android/i.test(ua), apple=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/i.test(ua)&&navigator.maxTouchPoints>1), mac=/Macintosh/i.test(ua)&&!apple, edge=/Edg\//.test(ua);
  const tips=[];
  if(android) tips.push('<b>Android:</b> open Settings, search “Text-to-speech”, choose <i>Speech Services by Google</i>, tap ⚙ › Install voice data › English (United Kingdom or Australia), and download a voice. Then close and reopen this page and pick it here.');
  if(apple) tips.push('<b>iPhone or iPad:</b> Settings › Accessibility › Spoken Content › Voices › English. Download one marked <i>Enhanced</i> or <i>Premium</i>, then reopen this page.');
  if(mac) tips.push('<b>Mac:</b> System Settings › Accessibility › Spoken Content › System voice › Manage Voices. Download one marked <i>Premium</i>, then reopen this page.');
  if(!android && !apple && !edge) tips.push('<b>Computer:</b> Microsoft Edge has the most natural voices (their names say “Natural” or “Online”). Open this page in Edge to use them.');
  if(edge) tips.push('Voices with “Natural” or “Online” in the name sound the most like a real person.');
  return `<details class="vtips"><summary>Get a nicer voice</summary>${tips.map(t=>`<p>${t}</p>`).join('')}</details>`;
}
/* Backup codes: every name's progress in one piece of text. */
function backupCode(){
  save();
  const all=players.map(p=>({id:p.id, name:p.name, state:p.id===who?state:lsGet(STORE+':'+p.id,null)})).filter(x=>x.state);
  const json=JSON.stringify({app:'maths-moon', v:1, at:Date.now(), players:all});
  return 'MATHSMOON1:'+btoa(unescape(encodeURIComponent(json)));
}
function readBackup(code){
  const m=String(code||'').replace(/\s+/g,'').match(/MATHSMOON1:([A-Za-z0-9+\/=]+)/); if(!m) return null;
  try{ const d=JSON.parse(decodeURIComponent(escape(atob(m[1])))); return d && Array.isArray(d.players) && d.players.length ? d : null; }catch(e){ return null; }
}
function loadBackup(d){
  let n=0;
  d.players.forEach(p=>{ const st=migrate(p.state); const name=String(p.name||'').trim().slice(0,30); if(!st||!name) return;
    let ex=players.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!ex){ let id=slugName(name), k=2; while(players.some(x=>x.id===id)) id=slugName(name)+'-'+(k++); ex={id,name}; players.push(ex); }
    lsSet(STORE+':'+ex.id, st); n++; });
  lsSet(NAMES_KEY,players);
  if(who) loadLocal(who);
  return n;
}
function bkShow(txt){ $('#bkBox').innerHTML='<textarea readonly></textarea>'; const t=$('#bkBox textarea'); t.value=txt; t.focus(); t.select(); $('#bkMsg').textContent='Select all and copy.'; }
function openGrown(){ clearTimers(); hush(); if(cur && view==='sum') cur.timeBad=true; afterGrown={view}; resetArmed=false; whoArmed=null; view='grown'; render(); window.scrollTo(0,0); }
function closeGrown(){
  const a=afterGrown||{view:'start'}; afterGrown=null;
  if(!who){ view='who'; return render(); }
  if(a.view==='sum' && sess && cur){ view='sum'; render();
    if(cur.answered){ if(sess.speed) later(advanceSpeed,500); else if(cur.ok) later(nextOne,800); }
    else if(!sess.speed) say(['What is '+sumSpeech(cur.q)+'?']);
    return; }
  if(a.view==='end' && sess){ view='end'; return render(); }
  if(a.view==='speedEnd' && sess && sess.result){ view='speedEnd'; return render(); }
  if(a.view==='moons'){ view='moons'; return render(); }
  view='start'; render();
}

/* hold to open (stops her opening it by accident); Enter or Space also opens it */
(function(){
  const b=$('#grownBtn'), fillEl=$('#grownFill'); let t0=0, raf=0;
  const stop=()=>{ cancelAnimationFrame(raf); t0=0; fillEl.style.width='0'; };
  const step=()=>{ const p=Math.min(1,(performance.now()-t0)/1200); fillEl.style.width=(p*100)+'%'; if(p>=1){ stop(); if(view!=='grown') openGrown(); } else raf=requestAnimationFrame(step); };
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); t0=performance.now(); raf=requestAnimationFrame(step); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener('click',e=>{ if(e.detail===0 && view!=='grown') openGrown(); });
  b.addEventListener('contextmenu',e=>e.preventDefault());
})();
$('#hearBtn').onclick=()=>{ if(sess && sess.speed && cur && !cur.answered) say(['What is '+sumSpeech(cur.q)+'?'],{noRemember:true}); else if(lastLines.length) say(lastLines,{noRemember:true}); };
$('#stopBtn').onclick=hush;
$('#exitBtn').onclick=()=>{ hush(); clearTimers(); if(sess && sess.speed){ if(sess.done>0) finishSpeed(); else { sess=null; openMoons('start'); } } else if(sess) finishRound(); else { view='start'; render(); } };
$('#moonsBtn').onclick=()=>{ if(view==='sum'){ clearTimers(); } openMoons(view==='sum'?'sum':view==='speedEnd'?'start':view); };

/* keyboard: digits, dot, Backspace and Enter on the number pad; Enter for Next; Esc closes pop-ups */
document.addEventListener('keydown',ev=>{
  if(ev.ctrlKey||ev.metaKey||ev.altKey) return;
  if(ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
  if(view==='moons' && popSkill && ev.key==='Escape'){ ev.preventDefault(); popSkill=null; render(); return; }
  if(view!=='sum'||!cur) return;
  if(cur.tipsOpen){ if(ev.key==='Escape'){ ev.preventDefault(); closeTips(); } return; }
  if(cur.answered){ if(ev.key==='Enter' && !cur.ok && !sess.speed){ ev.preventDefault(); nextOne(); } return; }
  if(cur.mode==='pad'){
    if(/^[0-9]$/.test(ev.key)){ ev.preventDefault(); typeKey(ev.key); }
    else if(ev.key==='.'||ev.key===','){ ev.preventDefault(); typeKey('.'); }
    else if(ev.key==='Backspace'){ ev.preventDefault(); typeKey('back'); }
    else if(ev.key==='Enter'){ ev.preventDefault(); typeKey('ok'); }
  }
});
/* the sum shrinks to fit on one line on a small phone */
function fitSum(){
  const el=$('#sumBox'); if(!el) return;
  el.style.fontSize=''; let fs=parseFloat(getComputedStyle(el).fontSize), n=0;
  while(el.scrollWidth>el.clientWidth+1 && fs>24 && n<40){ fs*=0.92; el.style.fontSize=fs+'px'; n++; }
}
window.addEventListener('resize',()=>requestAnimationFrame(fitSum));

/* offline helper on the website (not when opened as a file) */
const SW_VERSION='202611150132';
if('serviceWorker' in navigator && location.protocol==='https:'){ addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js?v='+SW_VERSION).catch(()=>{}); }); }

appReady=true;
view=who?'start':'who';
render();
})();
</script>
